function looksAmount(v){
  var t=String(v==null?"":v).trim();
  if(!t) return false;
  t=t.replace(/(AED|USD|GBP|EUR|AUD|JPY|THB|INR|SGD|CNY|PKR|SAR|DHS|RS|DH)/gi,"").replace(/[$£€¥]/g,"").trim();
  return /^[-+(]?\d[\d,.\s]*\)?-?$/.test(t);
}
var PAYWORDS=/^(cash|bank|cheque|check|card|transfer|online|tt|wire)$/i;
function looksPayBy(v){ return PAYWORDS.test(String(v==null?"":v).trim()); }
function guessCols(grid,cols){
  var head=grid[0].map(function(c){return String(c||"").toLowerCase();}), g=[-1,-1,-1,-1];
  head.forEach(function(h,i){
    if(/date/.test(h)) g[0]=i;
    else if(/detail|descrip|particular|narration/.test(h)) g[1]=i;
    else if(/pay\s*by|mode|method|type/.test(h)) g[2]=i;
    else if(/total|amount|debit|credit|value/.test(h)) g[3]=i;
  });
  if(g.join()==="-1,-1,-1,-1"){
    var sample=grid.slice(0,40), sd=[],sa=[],sp=[],st=[];
    for(var c=0;c<cols;c++){
      var d=0,a=0,p=0,t=0;
      sample.forEach(function(r){
        if(parseDate(r[c])) d++;
        if(looksAmount(r[c])) a++;
        if(looksPayBy(r[c])) p++;
        if(String(r[c]||"").trim().length>3 && !looksAmount(r[c]) && !parseDate(r[c])) t++;
      });
      sd.push(d); sa.push(a); sp.push(p); st.push(t);
    }
    var used={};
    g[0]=sd.indexOf(Math.max.apply(null,sd)); used[g[0]]=1;
    var ac=sa.map(function(v,i){return used[i]?-1:v;});
    g[3]=ac.indexOf(Math.max.apply(null,ac)); used[g[3]]=1;
    var pc=sp.map(function(v,i){return used[i]?-1:v;});
    if(Math.max.apply(null,pc)>0){ g[2]=pc.indexOf(Math.max.apply(null,pc)); used[g[2]]=1; }
    var tc=st.map(function(v,i){return used[i]?-1:v;});
    if(Math.max.apply(null,tc)>0){ g[1]=tc.indexOf(Math.max.apply(null,tc)); used[g[1]]=1; }
    for(var c2=0;c2<cols;c2++){ if(!used[c2]){ if(g[1]<0){g[1]=c2;used[c2]=1;} else if(g[2]<0){g[2]=c2;used[c2]=1;} } }
  } else { if(g[0]<0)g[0]=0; if(g[1]<0)g[1]=1; if(g[2]<0&&cols>2)g[2]=2; if(g[3]<0)g[3]=cols-1; }
  return g;
}
function parseGrid(text){
  text=String(text||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
  if(!text) return [];
  var useTab=text.indexOf("\t")>-1, sep=useTab?"\t":",", rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function(r){ return r.some(function(c){return String(c).trim()!=="";}); })
    .filter(function(r,i){ if(i>0) return true; var j=r.join(" ").toLowerCase(); return !(/date/.test(j)&&/(detail|amount|total|pay)/.test(j)); });
}

function addEntry(){
  var a=acct(); if(!a.id||isAll()) return toast("Open an account first");
  var raw=$("#f-amt").value.trim(), n=parseAmount(raw);
  if(isNaN(n)){ $("#f-amt").focus(); return toast("Enter an amount"); }
  var det=$("#f-det").value.trim();
  if(!det){ $("#f-det").focus(); return toast("Add a short detail"); }
  var wasUsd=usdOn();
  var mag=Math.abs(n) * (wasUsd?USD_RATE:1);
  var v = (/-/.test(raw) ? -1 : sign) * mag;
  var e={id:uid(), accountId:a.id, date:$("#f-date").value||todayISO(), details:det, payBy:$("#f-pay").value, amount:v, tag:""};
  var min=a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0)-1;
  DB.entries[e.id]=Object.assign({pos:min, deleted:"", createdBy:AUTH.user, createdAt:new Date().toISOString(), updatedBy:AUTH.user, updatedAt:new Date().toISOString()}, e);
  op({t:"addEntry", e:e});
  $("#f-det").value=""; $("#f-amt").value="";
  $("#f-usd").checked=false; usdHint();          // $ resets every time, so nobody converts twice by accident
  rebuild(); renderAll();
  var msg = wasUsd ? "Added "+fmt(v,a.currency)+"  (from $"+Math.abs(n).toLocaleString("en-US")+")" : "Added "+fmt(v,a.currency);
  if($("#addrow").parentNode.id==="add-host"){ closeModal(); toast(msg); }
  else { $("#f-det").focus(); $("#tablewrap").scrollTop=0; if(wasUsd) toast(msg); }

function sideAction(kind,id,act){
  var a=acct(), item=(kind==="recv"?a.recv:a.pay).filter(function(x){return x.id===id;})[0];
  if(!item) return;
  if(act==="settle"){
    var e={id:uid(), accountId:a.id, date:todayISO(),
      details:(kind==="recv"?"RECEIVED FROM ":"PAID TO ")+item.name, payBy:"CASH",
      amount: kind==="recv"?Math.abs(item.amount):-Math.abs(item.amount), tag:""};
    var min=a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0)-1;
    DB.entries[e.id]=Object.assign({pos:min,createdBy:AUTH.user,createdAt:new Date().toISOString(),updatedBy:AUTH.user,updatedAt:new Date().toISOString()},e);
    op({t:"addEntry", e:e});
  }
  delete DB.side[id];
  op({t:"side", op:act, id:id});
  rebuild(); renderAll();
  toast(act==="settle"?"Posted to the ledger":"Removed");
}

  $("#bulk-del").onclick=bulkDelete;
  $("#bulk-move").onchange=function(){
    var v=this.value; this.value="";
    if(v==="__SPLIT__") return splitEntries(Object.keys(PICK));
    if(v) bulkMove(v);
  };

  var press=null, pressId=null;
  $("#tbody").addEventListener("pointerdown",function(ev){
    var h=ev.target.closest("[data-drag]");
    if(h && ev.button!==2){ startDrag(ev, h.dataset.drag); }
  });
  $("#tbody").addEventListener("click",function(ev){
    if(ev.target.closest("[data-drag]")) return;
    var mb=ev.target.closest(".rowmenu");
    if(mb){ var r=mb.getBoundingClientRect(); return openCtx(Math.max(8,r.left-210), r.bottom+4, mb.dataset.id); }
    var cb=ev.target.closest("[data-pick]");
    if(cb){ return togglePick(cb.dataset.pick, ev.shiftKey); }
    var sc=ev.target.closest("td.c-sel");
    if(sc){ var trs=sc.closest("tr[data-id]"); if(trs) return togglePick(trs.dataset.id, ev.shiftKey); return; }
    var td=ev.target.closest("td[data-field]") || ev.target.closest("[data-field]");
    if(td) startEdit(td.hasAttribute("data-field")?td:td.closest("[data-field]"));
  });
  $("#tbody").addEventListener("contextmenu",function(ev){
    var tr=ev.target.closest("tr[data-id]"); if(!tr) return;
    ev.preventDefault(); openCtx(ev.clientX,ev.clientY,tr.dataset.id);
  });
  $("#tbody").addEventListener("touchstart",function(ev){
    if(ev.target.closest("[data-drag]")||ev.target.closest("[data-pick]")) return;
    var tr=ev.target.closest("tr[data-id]"); if(!tr) return;
    pressId=tr.dataset.id;
    press=setTimeout(function(){ if(navigator.vibrate) navigator.vibrate(12); openCtx(0,0,pressId); press=null; },520);
  },{passive:true});
  ["touchend","touchmove","touchcancel","scroll"].forEach(function(evt){
    $("#tbody").addEventListener(evt,function(){ if(press){ clearTimeout(press); press=null; } },{passive:true});
  });
  document.addEventListener("mousedown",function(ev){ if(!ev.target.closest("#ctx")) closeCtx(); });
  document.addEventListener("touchstart",function(ev){ if(!ev.target.closest("#ctx") && !ev.target.closest("#tbody")) closeCtx(); },{passive:true});
  $("#scrim").addEventListener("mousedown",function(ev){ if(ev.target===$("#scrim")) closeModal(); });
  $$(".padd button").forEach(function(b){ b.onclick=function(){ addSide(b.dataset.add); }; });
  ["recv","pay"].forEach(function(k){
    ["-n","-a"].forEach(function(s){ $("#"+k+s).addEventListener("keydown",function(e){ if(e.key==="Enter") addSide(k); }); });
  });
  document.addEventListener("keydown",function(e){
    lastActivity=Date.now();
    var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||"")||e.target.isContentEditable;
    if(e.key==="Escape"){ closeCtx(); if($("#scrim").classList.contains("show")) closeModal(); return; }
    if(typing) return;
    if(e.key==="/"){ e.preventDefault(); $("#q").focus(); }
    if(e.key.toLowerCase()==="n"){ e.preventDefault(); if(isTouch()) openAddSheet(); else $("#f-det").focus(); }
  });
  document.addEventListener("mousemove",function(){ lastActivity=Date.now(); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden){ lastActivity=Date.now(); net.lastPull=0; pollTick(); } });
  window.addEventListener("online",function(){ net.lastPull=0; flush(); pollTick(); });
  window.addEventListener("beforeunload",function(e){ if(Q.length){ e.preventDefault(); e.returnValue=""; } });
  var rt; window.addEventListener("resize",function(){ clearTimeout(rt); rt=setTimeout(function(){ if(isAll()) renderAllView(); else renderTable(); },250); });
  setInterval(pollTick,1500);
  setInterval(function(){ if(Q.length && !net.sending) flush(); },5000);
  setInterval(renderFeed,60000);
}

/* =============================================================== BOOT ==== */
function showApp(){
  $("#gate").classList.remove("show");
  $("#app").classList.add("show");
  $("#f-date").value=todayISO();
  renderAll(); setNet(Q.length?"saving":"live");
}
function doLogin(){
  var pw=$("#gate-pw").value;
  if(!pw) return;
  var btn=$("#gate-go"); btn.disabled=true; btn.textContent="Checking…"; $("#gate-err").textContent="";
  api("login",{password:pw}).then(function(res){
    btn.disabled=false; btn.textContent="Sign in";
    if(res && res.ok){
      AUTH.token=res.token; AUTH.user=res.user; AUTH.people=res.people||[];
      lsSet("token",res.token); lsSet("user",res.user); lsSet("people",AUTH.people);
      $("#gate-pw").value="";
      DB.accounts={}; DB.entries={}; DB.side={};
      ingest(res); showApp(); flush();
      toast("Welcome, "+res.user);
    } else {
      $("#gate-err").textContent=(res&&res.message)||"That password did not work.";
      $("#gate-pw").select();
    }
  }).catch(function(){
    btn.disabled=false; btn.textContent="Sign in";
    $("#gate-err").textContent="Could not reach the server. Check your connection.";
  });
}
(function boot(){
  var cached=lsGet("db",null), cui=lsGet("ui",{});
  S.theme=cui.theme||"light"; S.activeId=cui.activeId||null; S.tagLabels=cui.tagLabels||{};
  document.documentElement.setAttribute("data-theme",S.theme);
  if(cached){ DB.rev=cached.rev||0; DB.since=cached.since||""; DB.accounts=cached.accounts||{}; DB.entries=cached.entries||{}; DB.side=cached.side||{}; DB.audit=cached.audit||[]; }
  Q=lsGet("q",[])||[];
  AUTH.token=lsGet("token","")||""; AUTH.user=lsGet("user","")||""; AUTH.people=lsGet("people",[])||[];
  bind();

  if("serviceWorker" in navigator && location.protocol==="https:"){
    window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }

  if(!API_URL){
    $("#gate-sub").innerHTML="Not connected to your Google Sheet yet.";
    $("#gate-pw").style.display="none"; $("#gate-go").textContent="Open offline demo";
    $("#gate-go").onclick=function(){
      DEMO=true; AUTH.user="DEMO"; AUTH.people=["DEMO"];
      if(!Object.keys(DB.accounts).length){
        ["SIAM","AUS/JPN","UK/USA","BKK/DXB","CASH"].forEach(function(n,i){
          var id="demo"+i; DB.accounts[id]={id:id,name:n,currency:"AED",opening:0,pos:i,deleted:""};
        });
      }
      rebuild(); showApp(); setNet("live");
    };
    return;
  }

  $("#gate-go").onclick=doLogin;
  $("#gate-pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });

  if(AUTH.token){
    rebuild();
    if(Object.keys(DB.accounts).length) showApp();
    api("pull",{rev:0, full:true}).then(function(res){
      if(res && res.ok){ ingest(res); showApp(); flush(); }
      else if(res && res.error==="AUTH") signedOut();
      else setNet("off",(res&&res.message)||"");
    }).catch(function(err){
      if(Object.keys(DB.accounts).length) setNet("off",err.message);
      else $("#gate-err").textContent="Could not reach the server. Check your connection.";
    });
  }
  setTimeout(function(){ var p=$("#gate-pw"); if(p && $("#gate").classList.contains("show") && !isTouch()) p.focus(); },120);
})();
</script>
