<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b23" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SIAM HISAAB">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>SIAM HISAAB</title>
<style>
/* ============================ THEME ============================ */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel-2:#fafbfc; --ink:#111827; --ink-2:#4b5563; --ink-3:#8a94a6;
  --line:#e4e8ee; --line-2:#eef1f5; --accent:#1f6feb; --accent-soft:#e8f0fe;
  --pos:#0f8a4a; --pos-soft:#e7f6ed; --neg:#c0392b; --neg-soft:#fdecea;
  --warn:#b45309; --warn-soft:#fff5e0;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  --radius:12px;
  --t-blue:#2563eb; --t-blue-s:#dceaff;
  --t-red:#dc2626;  --t-red-s:#fbdedd;
  --t-green:#16a34a;--t-green-s:#d9f2e1;
  --t-amber:#d97706;--t-amber-s:#fcedcd;
  --t-purple:#7c3aed;--t-purple-s:#eae0ff;
  --t-teal:#0d9488; --t-teal-s:#d5efeb;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1a212b; --ink:#e6edf3; --ink-2:#a9b4c0; --ink-3:#71808f;
  --line:#262d38; --line-2:#1f2630; --accent:#5b9dff; --accent-soft:#16233a;
  --pos:#4ade80; --pos-soft:#12271b; --neg:#ff7b72; --neg-soft:#2a1616;
  --warn:#fbbf24; --warn-soft:#2b2110;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
  --t-blue:#7aa9ff; --t-blue-s:#16233d;
  --t-red:#ff8b82;  --t-red-s:#33191a;
  --t-green:#5cd68a;--t-green-s:#122a1c;
  --t-amber:#f0b74a;--t-amber-s:#302512;
  --t-purple:#b48cff;--t-purple-s:#241a3d;
  --t-teal:#4dd6c4; --t-teal-s:#11302d;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13.5px; -webkit-font-smoothing:antialiased; overflow:hidden;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.spacer{flex:1}
.only-wide{display:inline-flex}
.only-narrow{display:none}

/* ============================ LOGIN ============================ */
#gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1220);padding:22px;
  padding-top:calc(22px + var(--sat));padding-bottom:calc(22px + var(--sab))}
#gate.show{display:flex}
.gatecard{width:min(400px,100%);background:#fff;border-radius:18px;padding:30px 30px 24px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7);text-align:center;color:#111827}
.gatecard h1{margin:0;font-size:17px;letter-spacing:.14em;font-weight:800;line-height:1.35}
.gatecard h1 span{display:block;font-size:10px;letter-spacing:.1em;color:#6b7280;font-weight:700;margin-top:3px}
.gatecard p{margin:6px 0 20px;font-size:12.5px;color:#6b7280}
.gatecard input{width:100%;height:48px;border:1.5px solid #e5e7eb;border-radius:11px;padding:0 14px;
  font-size:17px;text-align:center;letter-spacing:.28em;outline:none;background:#f9fafb;color:#111827}
.gatecard input:focus{border-color:#1f6feb;background:#fff;box-shadow:0 0 0 4px rgba(31,111,235,.14)}
.gatecard button.go{width:100%;height:46px;margin-top:12px;border-radius:11px;background:#111827;color:#fff;font-weight:700;letter-spacing:.04em}
.gatecard button.go:hover{background:#1f6feb}
.gatecard button.go:disabled{opacity:.55;cursor:default}
.gateerr{min-height:18px;margin-top:11px;font-size:12.5px;color:#c0392b;font-weight:600}
.gatefoot{margin-top:16px;font-size:11px;color:#9ca3af;line-height:1.6}

/* ============================ SHELL ============================ */
#app{display:none;flex-direction:column;height:100vh;height:100dvh}
#app.show{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:var(--sat);
  height:calc(52px + var(--sat));flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;justify-content:center;min-width:0}
.brand b{font-weight:800;letter-spacing:.1em;font-size:12.5px;white-space:nowrap;line-height:1.2}
.brand .co{font-weight:700;font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);display:block}
.brand small{font-weight:500;letter-spacing:.02em;font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;
  color:var(--ink-2);font-size:12.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.tbtn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
.tbtn.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08);background:var(--accent);color:#fff}
.tbtn.ghost{border:1px solid var(--line)}
.tbtn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.people{display:flex;align-items:center;gap:4px}
.who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;
  position:relative;border:2px solid var(--panel)}
.who.off{opacity:.32;filter:grayscale(.6)}
.who.me::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--pos);border:2px solid var(--panel)}
.sync{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos);font-style:normal;flex:0 0 auto}
.sync.saving i{background:var(--warn);animation:pulse 1s infinite}
.sync.off i{background:var(--neg)}
.sync.off{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
@keyframes pulse{50%{opacity:.25}}

.tabbar{display:flex;align-items:stretch;gap:2px;padding:0 10px;height:42px;flex:0 0 auto;overflow-x:auto;
  background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:8px 8px 0 0;color:var(--ink-3);
  font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel-2)}
.tab .bal{font-weight:500;font-size:11.5px;color:var(--ink-3)}
.tab.active .bal{color:var(--accent)}
.tab .bal.neg{color:var(--neg)}
.tab.all{color:var(--accent);font-weight:800;letter-spacing:.08em}
.tab.all.active{background:var(--accent-soft)}

.banner{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--warn-soft);color:var(--warn);
  border-bottom:1px solid var(--line);font-size:12.5px;font-weight:500;flex:0 0 auto}
.banner.show{display:flex}
.banner .tbtn{color:var(--warn);border-color:currentColor;height:26px}

.stats{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:10px;padding:12px 16px 0;flex:0 0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow)}
.card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.card .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.card .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.card.hero{background:linear-gradient(135deg,var(--panel),var(--panel-2))}
.card.hero .v{font-size:27px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)}

.work{display:flex;gap:12px;padding:12px 16px 14px;flex:1 1 auto;min-height:0}
.ledger{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.side{flex:0 0 306px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:2px}

.toolbar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 9px;height:32px;min-width:160px;flex:1 1 160px;max-width:300px}
.search input{border:none;background:none;outline:none;width:100%;font-size:13px}
.search svg{flex:0 0 auto;opacity:.5}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--panel)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:currentColor}
#tagchips{display:flex;gap:6px;flex-wrap:wrap}
select.mini{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 6px;font-size:12.5px;outline:none}

.addrow{display:flex;gap:7px;align-items:center;padding:9px 11px;background:var(--accent-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.addrow input,.addrow select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 9px;outline:none;font-size:13px}
.addrow input:focus,.addrow select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
#f-det{flex:1 1 220px;min-width:140px}
#f-amt{width:120px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
#f-date{width:145px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:34px;background:var(--panel)}
.seg button{padding:0 13px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.seg button.on[data-sign="-1"]{background:var(--neg-soft);color:var(--neg)}
.seg button.on[data-sign="1"]{background:var(--pos-soft);color:var(--pos)}
.usd{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-weight:800;font-size:13px;color:var(--ink-3);cursor:pointer;user-select:none}
.usd input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.chk{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel-2);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.chk input{width:17px!important;height:17px!important;min-width:0!important;accent-color:var(--accent);margin:0;flex:0 0 auto}
.field .chk{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600}
.chk.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.amt.zero{color:var(--ink-3);font-weight:500}
tbody tr.blank td{background:var(--panel-2)}
tbody tr.blank .c-det{min-height:19px}
.usd.on{background:var(--pos-soft);border-color:var(--pos);color:var(--pos)}
#usd-hint{font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}

.tablewrap{flex:1 1 auto;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;text-align:left;padding:8px 12px;white-space:nowrap}
tbody td{padding:7px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.42}
tbody tr:hover td{background:var(--panel-2)}
.c-sel{width:34px;padding-left:12px!important}
.c-sel input{width:17px;height:17px;accent-color:var(--accent);margin:1px 0 0}
.c-date{width:132px;white-space:nowrap;color:var(--ink-2);font-size:12.5px}
.c-pay{width:82px}
.c-amt{width:148px;text-align:right;font-weight:600;white-space:nowrap}
.c-bal{width:140px;text-align:right;color:var(--ink-3);white-space:nowrap;font-size:12.5px}
.c-act{width:62px;text-align:right;color:var(--ink-3);white-space:nowrap;padding-right:8px!important}
.c-det{word-break:break-word}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);color:var(--ink-2);background:var(--panel)}
.pill.bank{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.rowmenu,.drag{width:24px;height:24px;border-radius:6px;color:var(--ink-3);font-size:13px;line-height:1;
  display:inline-grid;place-items:center;vertical-align:middle}
.rowmenu:hover,.drag:hover{background:var(--line);color:var(--ink)}
.drag{cursor:grab;touch-action:none;opacity:.45}
tr:hover .drag{opacity:1}
.drag:active{cursor:grabbing}
.drag svg{pointer-events:none}
tbody tr.dragging td{background:var(--accent-soft)!important}
tbody tr.dragging{box-shadow:0 8px 22px -6px rgba(16,24,40,.35);position:relative;z-index:2;opacity:.96}
body.dragging-row{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.dragging-row .tablewrap{scroll-behavior:auto}
tbody tr[data-tag] td:first-child{position:relative}
tbody tr[data-tag] td:first-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tagc)}
tr.t-blue{--tagc:var(--t-blue)}   tr.t-blue td{background:var(--t-blue-s)}
tr.t-red{--tagc:var(--t-red)}     tr.t-red td{background:var(--t-red-s)}
tr.t-green{--tagc:var(--t-green)} tr.t-green td{background:var(--t-green-s)}
tr.t-amber{--tagc:var(--t-amber)} tr.t-amber td{background:var(--t-amber-s)}
tr.t-purple{--tagc:var(--t-purple)} tr.t-purple td{background:var(--t-purple-s)}
tr.t-teal{--tagc:var(--t-teal)}   tr.t-teal td{background:var(--t-teal-s)}
tr.opening td{background:var(--panel-2)!important;font-weight:600;color:var(--ink-2);border-top:2px solid var(--line)}
tr.picked td{background:var(--accent-soft)!important}
tr.picked td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 34%,transparent)}100%{background:transparent}}
tr.flash td{animation:flash 1.7s ease-out}
td .edit{width:100%;border:1px solid var(--accent);border-radius:6px;padding:5px 7px;outline:none;background:var(--panel);font-size:16px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
td .edit.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
textarea.edit{resize:vertical;min-height:60px;line-height:1.42}
.empty{padding:52px 20px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink-2);margin:0 0 6px;font-size:15px}
.footnote{padding:8px 12px;border-top:1px solid var(--line);background:var(--panel-2);color:var(--ink-3);font-size:11.5px;line-height:1.6}

/* ---------- ALL view ---------- */
.allview{flex:1 1 auto;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.allhead{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.alltot{flex:1 1 220px;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:linear-gradient(135deg,var(--panel),var(--panel-2))}
.alltot .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.alltot .v{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.alltot .s{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.atable{width:100%;border-collapse:collapse}
.atable th{text-align:right;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.atable th:first-child{text-align:left}
.atable td{padding:10px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
.atable td:first-child{text-align:left;font-weight:600;white-space:normal}
.atable tr.click{cursor:pointer}
.atable tr.click:hover td{background:var(--panel-2)}
.atable tr.ex td{color:var(--ink-3)}
.atable tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:none;background:var(--panel-2)}
.exbadge{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:1px 7px;vertical-align:middle}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;flex:0 0 auto}
.panel h4{margin:0;padding:10px 12px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.panel h4 .tot{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:700}
.panel h4 .tot.recv{color:var(--pos)} .panel h4 .tot.pay{color:var(--neg)}
.panel h4 .lnk{font-size:11px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600;cursor:pointer}
.plist{max-height:210px;overflow:auto}
.pitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.pitem .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.pitem .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pitem .x,.pitem .ok{opacity:.35;color:var(--ink-3);font-size:15px;line-height:1;padding:3px 5px;border-radius:5px}
.pitem:hover .x,.pitem:hover .ok{opacity:1}
.pitem .ok:hover{color:var(--pos);background:var(--pos-soft)}
.pitem .x:hover{color:var(--neg);background:var(--neg-soft)}
.padd{display:flex;gap:6px;padding:8px 10px}
.padd input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:0 8px;outline:none;font-size:13px}
.padd input.a{flex:0 0 84px;text-align:right}
.padd button{flex:0 0 32px;height:32px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:7px 12px;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--ink-3)}
.kv b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.lg i{width:9px;height:9px;border-radius:50%;font-style:normal}
.feed{max-height:330px;overflow:auto}
.fi{display:flex;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line-2);font-size:12px;line-height:1.45}
.fi .av{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:8.5px;font-weight:800;margin-top:1px}
.fi .tx{flex:1;min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.fi .tx b{color:var(--ink);font-weight:600}
.fi .tm{color:var(--ink-3);font-size:10.5px;white-space:nowrap;margin-top:2px}
.fi .old{color:var(--neg);text-decoration:line-through;opacity:.75}
.fi .undo{flex:0 0 auto;align-self:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 9px;opacity:0;transition:.15s}
.fi:hover .undo{opacity:1}
.fi .undo:hover{color:var(--neg);border-color:var(--neg);background:var(--neg-soft)}
.fi .new{color:var(--pos);font-weight:600}

/* ---------- context menu ---------- */
.ctx{position:fixed;z-index:80;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px -8px rgba(16,24,40,.3);padding:5px;display:none}
.ctx.show{display:block}
.ctx .ci{display:flex;align-items:center;gap:9px;padding:9px;border-radius:8px;font-size:13px;width:100%;text-align:left;color:var(--ink-2)}
.ctx .ci:hover{background:var(--panel-2);color:var(--ink)}
.ctx .ci.danger:hover{background:var(--neg-soft);color:var(--neg)}
.ctx .sep{height:1px;background:var(--line);margin:5px 3px}
.ctx .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:5px 9px 2px;font-weight:700}
.ctx .swatches{display:flex;gap:7px;padding:4px 9px 8px;flex-wrap:wrap}
.ctx .sw2{width:26px;height:26px;border-radius:7px;border:2px solid transparent;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.ctx .sw2.on{border-color:var(--ink)}
.ctx select{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);padding:0 7px;margin:2px 0 4px;outline:none;font-size:13px}
.ctx .wrap{padding:0 9px 4px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);z-index:90;display:none;align-items:center;justify-content:center;padding:24px}
.scrim.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);
  width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:15px;font-weight:700}
.modal header p{margin:3px 0 0;font-size:12px;color:var(--ink-3)}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel-2)}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);outline:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}
.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.field select,.field input{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 8px;outline:none;font-size:13px;min-width:120px}
.prev{max-height:290px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table td,.prev table th{font-size:12px;padding:5px 9px}
.prev tr.bad td{background:var(--neg-soft);color:var(--neg)}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.acctrow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.acctrow input{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:0 8px;outline:none;font-size:13px}
.acctrow input.nm{flex:1 1 140px;min-width:0}
.acctrow input.ob{width:120px;text-align:right}
.htable{width:100%;font-size:12.5px}
.htable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.htable td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.htable td.w{white-space:nowrap;color:var(--ink-3)}
.menulist{display:flex;flex-direction:column}
.menulist button{display:flex;align-items:center;gap:12px;padding:15px 6px;border-bottom:1px solid var(--line-2);font-size:15px;text-align:left;color:var(--ink)}
.menulist button b{font-weight:600}
.menulist button span{color:var(--ink-3);font-size:12px}

/* ---------- bulk bar ---------- */
.bulkbar{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(16px + var(--sab));z-index:95;
  display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 44px -14px rgba(0,0,0,.5);transition:transform .2s;max-width:calc(100vw - 20px);overflow-x:auto}
.bulkbar.show{transform:translateX(-50%) translateY(0)}
.bulkbar b{font-size:12.5px;white-space:nowrap;padding-right:2px}
.bulkbar .sw2{width:24px;height:24px;border-radius:7px;border:2px solid transparent;flex:0 0 auto}
.bulkbar select{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);padding:0 7px;font-size:12.5px;outline:none}
.bdiv{width:1px;height:22px;background:var(--line);flex:0 0 auto}

/* ---------- FAB ---------- */
body.allview-on .fab{display:none!important}
.fab{position:fixed;right:calc(16px + var(--sar));bottom:calc(16px + var(--sab));z-index:70;width:56px;height:56px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:28px;font-weight:300;line-height:1;display:none;place-items:center;
  box-shadow:0 12px 28px -8px rgba(31,111,235,.7)}
.fab:active{transform:scale(.94)}

#toast{position:fixed;bottom:calc(18px + var(--sab));left:50%;transform:translateX(-50%) translateY(20px);z-index:100;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:500;opacity:0;transition:.22s;pointer-events:none;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .u{color:#facc15;font-weight:700;cursor:pointer;pointer-events:auto;margin-left:10px}

/* ======================= RESPONSIVE ======================= */
@media(max-width:1180px){
  .stats{grid-template-columns:1.4fr repeat(2,1fr)}
}
@media(max-width:1100px){
  body{overflow:auto;-webkit-overflow-scrolling:touch}
  #app{height:auto;min-height:100dvh}
  .topbar{position:sticky;top:0;z-index:55}
  .tabbar{position:sticky;top:calc(52px + var(--sat));z-index:54}
  .work{flex-direction:column;padding:10px 12px calc(90px + var(--sab))}
  .side{flex:1 1 auto;overflow:visible;padding-right:0}
  .ledger{overflow:visible}
  .tablewrap{overflow:visible;max-height:none}
  thead th{position:static}
  .allview{overflow:visible;max-height:none}
  .feed{max-height:300px}
}
@media(max-width:760px){
  body{font-size:14px}
  .stats{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:9px;padding:10px 12px 0;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stats .card{flex:0 0 min(78vw,300px);scroll-snap-align:start}
  .stats .card.hero{flex:0 0 min(88vw,340px)}
  .only-wide{display:none!important}
  .only-narrow{display:inline-flex}
  .topbar{gap:8px;padding:0 10px;padding-top:var(--sat)}
  .brand{max-width:40vw;overflow:hidden}
  .brand b{font-size:12px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .co{display:none}
  .who{width:27px;height:27px;font-size:9px}
  .sync span{display:none}
  .sync{padding:0 8px}
  .fi .undo{opacity:1}          /* no hover on a phone — always show it */
  .fi{padding:10px 11px}
  .toolbar{padding:8px 10px;gap:7px}
  .search{max-width:none;flex:1 1 140px}
  #tagchips,#f-payby,#f-month{display:none}
  body.filtersopen #tagchips{display:flex!important;width:100%}
  body.filtersopen #f-payby,body.filtersopen #f-month{display:inline-flex}
  #btn-filters.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .work{padding:8px 8px calc(96px + var(--sab));gap:8px}
  .ledger,.panel{border-radius:14px}
  .fab{display:grid}
  .addrow{display:none}
  body.addopen .addrow{display:flex}
  .footnote{font-size:11px}

  /* ledger rows become cards (scoped — other tables keep their own layout) */
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block}
  .tablewrap thead{display:none}
  .tablewrap tbody tr{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr) auto 28px;gap:1px 6px;
    padding:11px 8px 11px 4px;border-bottom:1px solid var(--line-2);align-items:start;overflow:hidden}
  .tablewrap tbody td{padding:0;border:none;background:none!important;min-width:0}
  .tablewrap tbody tr:hover td{background:none}
  .tablewrap tbody td.c-sel{grid-column:1;grid-row:1/span 2;align-self:center;width:auto;padding-left:2px!important}
  .tablewrap tbody td.c-det{grid-column:2;grid-row:1;font-size:14px;line-height:1.35;padding-right:4px}
  .tablewrap tbody td.c-amt{grid-column:3;grid-row:1;width:auto;font-size:14.5px;justify-self:end}
  .tablewrap tbody td.c-date{grid-column:2;grid-row:2;width:auto;font-size:11.5px;white-space:nowrap;
    justify-self:start;align-self:center;margin-top:3px}
  .tablewrap tbody td.c-pay{grid-column:2;grid-row:2;width:auto;justify-self:end;align-self:center;margin-top:3px;padding-left:10px}
  .tablewrap tbody td.c-bal{grid-column:3;grid-row:2;width:auto;font-size:11.5px;margin-top:3px;justify-self:end}
  .tablewrap tbody td.c-act{grid-column:4;grid-row:1/span 2;width:28px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;padding:0!important}
  .mv{opacity:1;width:28px;height:24px}
  .rowmenu{width:28px;height:26px;font-size:15px}
  .tablewrap tbody tr[data-tag]{border-left:4px solid var(--tagc)}
  .tablewrap tbody tr[data-tag] td:first-child::before{display:none}
  tr.t-blue{background:var(--t-blue-s)} tr.t-red{background:var(--t-red-s)}
  tr.t-green{background:var(--t-green-s)} tr.t-amber{background:var(--t-amber-s)}
  tr.t-purple{background:var(--t-purple-s)} tr.t-teal{background:var(--t-teal-s)}
  tr.picked{background:var(--accent-soft)!important;box-shadow:inset 3px 0 0 var(--accent)}
  .tablewrap tr.opening{display:flex!important;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel-2)!important;border-top:2px solid var(--line);padding:13px 12px}
  .tablewrap tr.opening .c-det{font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .tablewrap tr.opening .c-amt{font-size:14.5px}
  .tablewrap tr.opening .c-date,.tablewrap tr.opening .c-pay,.tablewrap tr.opening .c-bal,
  .tablewrap tr.opening .c-act,.tablewrap tr.opening .c-sel{display:none}
  tr.flash{animation:flash 1.7s ease-out}

  /* ALL summary becomes cards */
  .allview{padding:12px 10px 16px}
  .allhead{gap:8px;margin-bottom:10px}
  .alltot{flex:1 1 100%;padding:12px 14px}
  .alltot .v{font-size:24px}
  .atable,.atable tbody,.atable tfoot,.atable tr,.atable td{display:block}
  .atable thead{display:none}
  .atable tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--panel)}
  .atable td{border:none;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;text-align:right;font-size:13px}
  .atable td::before{content:attr(data-l);color:var(--ink-3);font-weight:500;text-align:left;font-size:12px;white-space:nowrap}
  .atable td:first-child{display:block;font-size:15px;font-weight:700;border-bottom:1px solid var(--line-2);padding-bottom:7px;margin-bottom:5px;text-align:left}
  .atable td:first-child::before{content:none}
  .atable tfoot tr{background:var(--panel-2);border:2px solid var(--line)}

  /* history rows stack */
  .htable,.htable tbody,.htable tr,.htable td{display:block}
  .htable thead{display:none}
  .htable tr{border-bottom:1px solid var(--line);padding:11px 0}
  .htable td{border:none;padding:2px 0}
  .htable td.w{font-size:11.5px}

  /* full-width sheets */
  .scrim{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;padding-bottom:var(--sab)}
  .modal .body{padding:14px}
  .modal header{padding:13px 14px}
  .modal footer{padding:11px 14px}
  .ctx{left:0!important;right:0!important;bottom:0!important;top:auto!important;width:100%;min-width:0;
    border-radius:18px 18px 0 0;padding:8px 8px calc(10px + var(--sab));box-shadow:0 -12px 40px rgba(0,0,0,.35)}
  .ctx .ci{padding:13px 12px;font-size:14.5px}
  .ctx .sw2{width:34px;height:34px}
  .ctx select{height:42px;font-size:15px}
  .bulkbar{left:8px;right:8px;transform:translateY(140%);max-width:none;border-radius:16px;
    flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;overflow:visible}
  .bulkbar.show{transform:translateY(0)}
  .bulkbar b{font-size:12.5px;width:100%;text-align:center;padding:0}
  .bulkbar .bdiv{display:none}
  #bulk-tags{width:100%;justify-content:center;gap:9px!important}
  .bulkbar .sw2{width:30px;height:30px}
  #bulk-move{flex:1 1 42%;height:38px}
  #bulk-del,#bulk-clear{height:38px}
  /* stop iOS zooming when a field is focused */
  input,select,textarea{font-size:16px!important}
  .chip,.tbtn,.pill,.tab,.fi,.kv,.hint,.footnote,.brand b,.brand small,.card .k,.card .s{font-size:unset}
  .card .v{font-size:20px} .card.hero .v{font-size:26px}
  .atable th,.atable td{padding:9px 6px;font-size:12.5px}
}
@media(max-width:400px){
  .c-det{font-size:13.5px}
  .tab{padding:0 10px}
}

@media print{
  .topbar,.tabbar,.toolbar,.addrow,.side,.banner,.c-act,.c-sel,.footnote,#toast,.fab,.bulkbar{display:none!important}
  body{overflow:visible;background:#fff}
  .work,.stats{padding:0}
  .ledger,.card{box-shadow:none;border-color:#ddd}
  .tablewrap{overflow:visible}
  #app{height:auto}
}
</style>
</head>
<body>

<!-- ============================== LOGIN ============================== -->
<div id="gate" class="show">
  <div class="gatecard">
    <h1>SIAM B K K INTERNATIONAL GENERAL TRADING L.L.C HISAAB</h1>
    <p id="gate-sub">Enter your password to continue</p>
    <input id="gate-pw" type="password" autocomplete="current-password" inputmode="text" placeholder="••••" autofocus>
    <button class="go" id="gate-go">Sign in</button>
    <div class="gateerr" id="gate-err"></div>
  </div>
</div>

<!-- =============================== APP =============================== -->
<div id="app">
  <div class="topbar">
    <div class="brand"><b>SIAM B K K INTERNATIONAL GENERAL TRADING L.L.C</b><small id="brandsub">Accounts Ledger</small></div>
    <div class="spacer"></div>
    <div class="people" id="people"></div>
    <div class="sync" id="sync" title="Sync status"><i></i><span>Live</span></div>
    <div id="actions" style="display:flex;gap:2px">
      <button class="tbtn only-wide" id="btn-import">⊕ Import</button>
      <button class="tbtn only-wide" id="btn-history">History</button>
      <button class="tbtn only-wide" id="btn-export">↧ Export</button>
      <button class="tbtn only-wide" id="btn-accounts">⚙ Accounts</button>
      <button class="tbtn only-wide" id="btn-theme">Dark</button>
      <button class="tbtn ghost only-wide" id="btn-out">Sign out</button>
    </div>
    <button class="tbtn ghost only-narrow" id="btn-menu" style="font-size:16px;padding:0 12px">⋯</button>
  </div>

  <div class="tabbar" id="tabbar"></div>

  <div class="banner" id="banner">
    <span>⚠</span><span id="banner-txt"></span>
    <div class="spacer"></div>
    <button class="tbtn" id="banner-retry">Retry</button>
    <button class="tbtn" id="banner-hide">Hide</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="work">
    <div class="ledger">
      <div class="toolbar" id="toolbar">
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search details…">
        </div>
        <button class="tbtn ghost only-narrow" id="btn-filters">⌄ Filters</button>
        <div id="tagchips"></div>
        <select class="mini" id="f-payby"><option value="all">All payments</option><option>CASH</option><option>BANK</option></select>
        <select class="mini" id="f-month"><option value="all">All months</option></select>
        <button class="chip" id="f-reset" style="display:none">✕ Clear</button>
        <div class="spacer only-wide"></div>
        <button class="tbtn ghost" id="btn-selall" title="Select every row shown">☑ All</button>
        <button class="tbtn ghost only-wide" id="btn-sort">⇅ Sort by date</button>
        <button class="tbtn ghost only-wide" id="btn-print">Print</button>
      </div>

      <div class="addrow" id="addrow">
        <input id="f-date" type="date">
        <input id="f-det" type="text" placeholder="Details of payment…">
        <select id="f-pay"><option>CASH</option><option>BANK</option></select>
        <div class="seg" id="seg"><button data-sign="-1" class="on">OUT</button><button data-sign="1">IN</button></div>
        <input id="f-amt" type="text" inputmode="decimal" placeholder="0.00">
        <label class="usd" id="usd-wrap" title="Amount is in US dollars"><input type="checkbox" id="f-usd"> $</label>
        <span id="usd-hint"></span>
        <button class="tbtn primary" id="btn-add" style="height:34px">Add entry</button>
      </div>

      <div class="tablewrap" id="tablewrap">
        <table>
          <thead><tr id="thead-row">
            <th class="c-sel" id="th-sel"><input type="checkbox" id="sel-all-box" title="Select all"></th>
            <th class="c-date">Date</th><th>Details of payment</th><th class="c-pay">Pay by</th>
            <th class="c-amt">Total</th><th class="c-bal">Balance</th><th class="c-act"></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" style="display:none"></div>
      </div>

      <div class="allview" id="allview" style="display:none"></div>
      <div class="footnote" id="footnote"></div>
    </div>

    <aside class="side" id="side">
      <div class="panel">
        <h4>Activity <span class="lnk" id="feed-all">See all →</span></h4>
        <div class="feed" id="feed"></div>
      </div>
      <div class="panel" id="panel-recv">
        <h4>Receivable <span class="tot recv" id="recv-tot"></span></h4>
        <div class="plist" id="recv-list"></div>
        <div class="padd"><input id="recv-n" placeholder="Who owes you"><input class="a" id="recv-a" inputmode="decimal" placeholder="0"><button data-add="recv">+</button></div>
      </div>
      <div class="panel" id="panel-pay">
        <h4>Payable <span class="tot pay" id="pay-tot"></span></h4>
        <div class="plist" id="pay-list"></div>
        <div class="padd"><input id="pay-n" placeholder="Who you owe"><input class="a" id="pay-a" inputmode="decimal" placeholder="0"><button data-add="pay">+</button></div>
      </div>
      <div class="panel"><h4>Position</h4><div id="position"></div></div>
      <div class="panel">
        <h4>Colour tags <span style="letter-spacing:0;text-transform:none;font-weight:500">long-press a row</span></h4>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </div>
</div>

<button class="fab" id="fab" title="Add entry">+</button>

<div class="bulkbar" id="bulkbar">
  <b id="bulk-n">0 selected</b>
  <div class="bdiv"></div>
  <div id="bulk-tags" style="display:flex;gap:6px"></div>
  <div class="bdiv"></div>
  <select id="bulk-move"><option value="">Move to…</option></select>
  <button class="tbtn" id="bulk-del" style="color:var(--neg)">🗑 Delete</button>
  <button class="tbtn ghost" id="bulk-clear">Done</button>

/* ------------------------------------------------------------------- utils */
function dec(c){ return CUR_DEC[c]==null?2:CUR_DEC[c]; }
function fmt(n,cur,o){
  cur = cur || (acct()||{}).currency || "AED"; n = Number(n)||0;
  var d = dec(cur), s = Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  return (n<0?"-":(o&&o.plus&&n>0?"+":"")) + cur + " " + s;
}
function fmtShort(n,cur){
  cur=cur||"AED"; n=Number(n)||0; var a=Math.abs(n),s;
  if(a>=1e6) s=(a/1e6).toFixed(a>=1e7?0:1)+"M"; else if(a>=1e3) s=(a/1e3).toFixed(a>=1e5?0:1)+"K"; else s=a.toFixed(0);
  return (n<0?"-":"")+cur+" "+s;
}
function parseAmount(v){
  if(typeof v==="number") return v;
  var s=String(v==null?"":v).trim(); if(!s) return NaN;
  var neg = /^\(.*\)$/.test(s) || /-/.test(s);
  s=s.replace(/[()]/g,"").replace(/[^0-9.,-]/g,"");
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/,/g,"");
  else if((s.match(/,/g)||[]).length===1 && /,\d{1,2}$/.test(s)) s=s.replace(",",".");
  else s=s.replace(/,/g,"");
  s=s.replace(/-/g,""); var n=parseFloat(s);
  return isNaN(n)?NaN:(neg?-n:n);
}
var MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function pad(n){return (n<10?"0":"")+n;}
function iso(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
function todayISO(){ var d=new Date(); return iso(d.getFullYear(),d.getMonth(),d.getDate()); }
function parseDate(v,dmy){
  var s=String(v==null?"":v).trim(); if(!s) return ""; var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(+m[1],+m[2]-1,+m[3]);
  var t=s.replace(/^[A-Za-z]{3,9},\s*/,"");
  if((m=t.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/))){
    var mo=MON[m[1].toLowerCase().slice(0,4)]!=null?MON[m[1].toLowerCase().slice(0,4)]:MON[m[1].toLowerCase().slice(0,3)];
    if(mo!=null) return iso(+m[3],mo,+m[2]);
  }
  if((m=t.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})$/))){
    var mo2=MON[m[2].toLowerCase().slice(0,4)]!=null?MON[m[2].toLowerCase().slice(0,4)]:MON[m[2].toLowerCase().slice(0,3)];
    if(mo2!=null) return iso(+m[3],mo2,+m[1]);
  }
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){
    var a=+m[1],b=+m[2],y=+m[3]; if(y<100) y+=2000;
    var day=dmy?a:b, mon=dmy?b:a; if(a>12 && !dmy){day=a;mon=b;}
    if(mon>=1&&mon<=12&&day>=1&&day<=31) return iso(y,mon-1,day);
  }
  var d=new Date(s);
  return isNaN(d.getTime())?"":iso(d.getFullYear(),d.getMonth(),d.getDate());
}
function fmtDate(s){
  if(!s) return "—";
  var p=String(s).split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d.getTime())?String(s):d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
}
function fmtDateShort(s){
  if(!s) return "—";
  var p=String(s).split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d.getTime())?String(s):d.toLocaleDateString("en-US",{day:"numeric",month:"short",year:"2-digit"});
}
function fmtWhen(ts){
  if(!ts) return "";
  var d=new Date(ts); if(isNaN(d.getTime())) return String(ts);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function ago(ts){
  var d=new Date(ts); if(isNaN(d.getTime())) return "";
  var s=(Date.now()-d.getTime())/1000;
  if(s<45) return "just now";
  if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" h ago";
  if(s<604800) return Math.round(s/86400)+" d ago";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function monthKey(s){ return s?String(s).slice(0,7):""; }
function monthName(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}); }
function personColor(name){
  var h=0; for(var i=0;i<String(name).length;i++) h=(h*31+String(name).charCodeAt(i))>>>0;
  return PERSON_COLORS[h%PERSON_COLORS.length];
}
function initials(n){ n=String(n||"?").trim(); return n.slice(0,3).toUpperCase(); }
function isAdmin(){ return DEMO || ADMINS.indexOf(AUTH.user)>-1; }
function toast(msg,undoFn){

  t.classList.add("show");

  if(undoFn) $("#toast-undo").onclick=function(){ undoFn(); t.classList.remove("show"); };
}

/* =========================================================== NETWORK ===== */
function api(action, payload){
  payload = payload||{}; payload.action=action;
  if(action!=="login" && action!=="ping") payload.token=AUTH.token;
  var body = JSON.stringify(payload);
  if(DEMO) return Promise.resolve({ok:false,error:"DEMO"});
  return fetch(API_URL,{method:"POST",body:body,headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(err){
      if(body.length>5500) throw err;
      return jsonp(payload);
    });
}
function jsonp(payload){
  return new Promise(function(res,rej){
    var cb="hcb"+Math.random().toString(36).slice(2), s=document.createElement("script"), done=false;
    var t=setTimeout(function(){ if(!done){done=true;clean();rej(new Error("timeout"));} },25000);
    function clean(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ if(done) return; done=true; clean(); res(d); };
    s.onerror=function(){ if(done) return; done=true; clean(); rej(new Error("network")); };
    s.src=API_URL+(API_URL.indexOf("?")>-1?"&":"?")+"callback="+cb+"&p="+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(s);
  });
}
function setNet(state,msg){
  net.state=state; net.lastErr=msg||"";
  var el=$("#sync"); if(!el) return;
  el.className="sync"+(state==="saving"?" saving":"")+(state==="off"?" off":"");
  var pend=Q.length;
  el.querySelector("span").textContent = DEMO ? "Demo"
    : state==="off" ? (pend? pend+" waiting" : "Offline")
    : state==="saving" ? (pend? "Saving "+pend+"…" : "Saving…") : "Live";
  var b=$("#banner"), show = state==="off" && !net.bannerHidden && !DEMO;
  b.classList.toggle("show", show);
  if(show) $("#banner-txt").innerHTML = "<b>Can't reach the ledger.</b> "+
    (pend? pend+" change"+(pend>1?"s":"")+" saved on this device, will upload automatically. " : "")+(msg?"("+esc(msg)+")":"");
}

/* ------------------------------------------------------------ merge state */
function ingest(res){
  if(!res) return;
  if(res.rev!=null) DB.rev=res.rev;
  if(res.since) DB.since=res.since;
  if(res.online) DB.online=res.online;
  var flashIds=[];
  (res.accounts||[]).forEach(function(a){ DB.accounts[a.id]=a; });
  (res.entries||[]).forEach(function(e){
    var prev=DB.entries[e.id];
    if(prev && prev.updatedAt!==e.updatedAt && e.updatedBy && e.updatedBy!==AUTH.user) flashIds.push(e.id);
    DB.entries[e.id]=e;
  });
  (res.side||[]).forEach(function(s){ DB.side[s.id]=s; });
  (res.deletedEntries||[]).forEach(function(id){ delete DB.entries[id]; delete PICK[id]; });
  (res.deletedSide||[]).forEach(function(id){ delete DB.side[id]; });
  if(res.audit && res.audit.length) DB.audit=res.audit;
  rebuild(); cacheAll(); renderAll();
  flashIds.forEach(function(id){
    var tr=$('#tbody tr[data-id="'+id+'"]');
    if(tr){ tr.classList.add("flash"); setTimeout(function(){ tr.classList.remove("flash"); },1800); }
  });
}
function rebuild(){
  var accs = Object.keys(DB.accounts).map(function(k){return DB.accounts[k];})
    .filter(function(a){ return !isTrue(a.deleted); })
    .sort(function(a,b){ return (Number(a.pos)||0)-(Number(b.pos)||0); });
  var byAcct={};
  accs.forEach(function(a){ byAcct[a.id]={id:a.id,name:a.name,currency:a.currency||"AED",opening:Number(a.opening)||0,pos:a.pos,entries:[],recv:[],pay:[]}; });
  Object.keys(DB.entries).forEach(function(k){
    var e=DB.entries[k], a=byAcct[e.accountId]; if(!a) return;
    a.entries.push({id:e.id,accountId:e.accountId,date:e.date,details:e.details,payBy:e.payBy||"CASH",
      amount:Number(e.amount)||0,tag:e.tag||"",pos:Number(e.pos)||0,
      createdBy:e.createdBy,createdAt:e.createdAt,updatedBy:e.updatedBy,updatedAt:e.updatedAt});
  });
  Object.keys(DB.side).forEach(function(k){
    var s=DB.side[k], a=byAcct[s.accountId]; if(!a) return;
    (s.kind==="pay"?a.pay:a.recv).push({id:s.id,name:s.name,amount:Number(s.amount)||0});
  });
  accs.forEach(function(a){ byAcct[a.id].entries.sort(function(x,y){ return x.pos-y.pos; }); });
  S.accounts = accs.map(function(a){ return byAcct[a.id]; });
  if(S.activeId!==ALL_ID && (!S.activeId || !S.accounts.filter(function(a){return a.id===S.activeId;}).length))
    S.activeId = S.accounts[0] ? S.accounts[0].id : ALL_ID;
}
function isTrue(v){ return v===true||v==="TRUE"||v==="true"||v===1||v==="1"; }
function isAll(){ return S.activeId===ALL_ID; }
function acct(){
  if(isAll()) return {id:ALL_ID, name:"ALL ACCOUNTS", currency:mainCurrency(), opening:0, entries:[], recv:[], pay:[]};
  var a=S.accounts.filter(function(x){return x.id===S.activeId;})[0];
  if(!a) a=S.accounts[0];
  return a || {id:null,name:"—",currency:"AED",opening:0,entries:[],recv:[],pay:[]};
}
function mainCurrency(){
  var count={},best="AED",n=0;
  S.accounts.forEach(function(a){ count[a.currency]=(count[a.currency]||0)+1; });
  Object.keys(count).forEach(function(c){ if(count[c]>n){n=count[c];best=c;} });
  return best;
}

/* ------------------------------------------------------------- op queue -- */
function op(o){
  o.opId = uid();
  Q.push(o); cacheAll();
  setNet(Q.length?"saving":"live");
  flush();
}
var flushTimer=null, backoff=1000;
function flush(){
  if(DEMO || net.sending || !Q.length || !AUTH.token) return;
  net.sending=true; setNet("saving");
  var batch=Q.slice(0,25);
  api("push",{ops:batch, since:DB.since, rev:DB.rev}).then(function(res){
    net.sending=false;
    if(res && res.ok){
      Q = Q.filter(function(o){ return batch.indexOf(o)<0; });
      backoff=1000; cacheAll(); ingest(res);
      setNet(Q.length?"saving":"live");
      if(Q.length) flush();
    } else if(res && res.error==="AUTH"){ signedOut(); }
    else retry(res && res.message);
  }).catch(function(err){ net.sending=false; retry(err.message); });
}
function retry(msg){
  setNet("off", msg);
  clearTimeout(flushTimer);
  backoff=Math.min(backoff*1.8, 30000);
  flushTimer=setTimeout(flush, backoff);
}

/* ---------------------------------------------------------------- polling */
function pollTick(){
  if(DEMO || !AUTH.token || document.hidden || net.sending) return;
  var wait = (Date.now()-lastActivity)>180000 ? 30000 : 6000;
  if(Date.now()-net.lastPull < wait) return;
  net.lastPull=Date.now();
  api("pull",{rev:DB.rev, since:DB.since}).then(function(res){
    if(res && res.ok){
      if(net.state==="off") setNet(Q.length?"saving":"live");
      if(res.changed) ingest(res);
      else { DB.online=res.online||DB.online; renderPeople(); }
      if(Q.length) flush();
    } else if(res && res.error==="AUTH") signedOut();
  }).catch(function(err){ setNet("off", err.message); });
}
function signedOut(){
  AUTH.token=""; lsSet("token","");
  $("#app").classList.remove("show"); $("#gate").classList.add("show");
  $("#gate-err").textContent="Your session expired — sign in again.";
  $("#gate-pw").focus();
}

/* =========================================================== COMPUTE ===== */
function totals(a){
  var bal=Number(a.opening)||0,inn=0,out=0,cash=0,bank=0;
  a.entries.forEach(function(e){
    var v=Number(e.amount)||0; bal+=v; if(v>=0) inn+=v; else out+=v;
    if(String(e.payBy||"").toUpperCase()==="BANK") bank+=v; else cash+=v;
  });
  var r=0,p=0; a.recv.forEach(function(x){r+=x.amount;}); a.pay.forEach(function(x){p+=x.amount;});
  return {bal:bal,in:inn,out:out,cash:cash,bank:bank,recv:r,pay:p,n:a.entries.length};
}
function filtered(a){
  var q=ui.q.trim().toLowerCase();
  return a.entries.filter(function(e){
    if(ui.tag!=="all"){ if(ui.tag==="none"?!!e.tag:e.tag!==ui.tag) return false; }
    if(ui.payBy!=="all" && String(e.payBy||"").toUpperCase()!==ui.payBy) return false;
    if(ui.month!=="all" && monthKey(e.date)!==ui.month) return false;
    if(q && ((e.details||"")+" "+(e.payBy||"")+" "+fmtDate(e.date)+" "+e.amount).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function filtersOn(){ return !!(ui.q.trim()||ui.tag!=="all"||ui.payBy!=="all"||ui.month!=="all"); }
function tagOf(id){ return TAGS.filter(function(t){return t.id===id;})[0]; }
function tagLabel(id){ return (S.tagLabels&&S.tagLabels[id])||(TAGS.filter(function(t){return t.id===id;})[0]||{}).label||id; }
function includedInAll(a){ return !EXCLUDE_FROM_ALL.test(a.name); }

/* ============================================================ RENDER ===== */
function renderAll(){
  document.documentElement.setAttribute("data-theme", S.theme||"light");
  $("#btn-theme").textContent = S.theme==="dark"?"Light":"Dark";
  applyRole();
  renderPeople(); renderTabs(); renderStats(); renderChips(); renderMonths();

  renderSide(); renderFeed(); renderBulk();
}

  var show = isAdmin() ? "" : "none";
  $("#btn-import").style.display = show;
  $("#btn-export").style.display = show;
}
function renderPeople(){
  var on={}; (DB.online||[]).forEach(function(o){ on[o.user]=o.since; });
  var list=(AUTH.people&&AUTH.people.length)?AUTH.people:Object.keys(on);
  $("#people").innerHTML=list.map(function(p){
    var isOn = !!on[p] || p===AUTH.user;

      esc(p)+(p===AUTH.user?" (you)":"")+" — "+(isOn?"online now":"offline")+'">'+esc(initials(p))+'</div>';
  }).join("");
}
function renderTabs(){
  var el=$("#tabbar");
  var html='<button class="tab all '+(isAll()?"active":"")+'" data-id="'+ALL_ID+'">ALL <span class="bal num">'+
    fmtShort(allTotals().bal, mainCurrency())+'</span></button>';
  html+=S.accounts.map(function(a){
    var t=totals(a);
    return '<button class="tab '+(a.id===S.activeId?"active":"")+'" data-id="'+a.id+'">'+esc(a.name)+
      ' <span class="bal num '+(t.bal<0?"neg":"")+'">'+fmtShort(t.bal,a.currency)+'</span></button>';
  }).join("");
  html+='<button class="tab" id="tab-add" style="color:var(--ink-3)">+</button>';
  el.innerHTML=html;
  $$(".tab[data-id]",el).forEach(function(b){
    b.onclick=function(){
      S.activeId=b.dataset.id; clearPick();
      ui.q="";$("#q").value="";ui.tag="all";ui.payBy="all";ui.month="all";$("#f-payby").value="all";
      cacheAll(); renderAll();
      var t=$("#tablewrap"); if(t) t.scrollTop=0;
    };
  });
  $("#tab-add").onclick=addAccount;
}
function allTotals(){
  var t={bal:0,in:0,out:0,recv:0,pay:0,n:0,byCur:{}};
  S.accounts.forEach(function(a){
    if(!includedInAll(a)) return;
    var x=totals(a);
    t.bal+=x.bal; t.in+=x.in; t.out+=x.out; t.recv+=x.recv; t.pay+=x.pay; t.n+=x.n;
    var c=a.currency||"AED";
    if(!t.byCur[c]) t.byCur[c]={bal:0,recv:0,pay:0,n:0};
    t.byCur[c].bal+=x.bal; t.byCur[c].recv+=x.recv; t.byCur[c].pay+=x.pay; t.byCur[c].n+=x.n;
  });
  return t;
}
function renderStats(){
  var a=acct();
  if(isAll()){
    var T=allTotals(), curs=Object.keys(T.byCur);
    var main=mainCurrency();
    $("#stats").innerHTML =
      card("hero","All accounts — balance", fmt(T.byCur[main]?T.byCur[main].bal:T.bal, main), (T.bal<0?"neg":"pos"),
           S.accounts.filter(includedInAll).length+" accounts · "+T.n+" entries")+
      card("","Money in",fmt(T.in,main),"pos","all credits")+
      card("","Money out",fmt(T.out,main),"neg","all debits")+
      card("","Receivable",fmt(T.recv,main),"pos","owed to you")+
      card("","Payable",fmt(T.pay,main),"neg","you owe");
    $("#brandsub").textContent=(AUTH.user?AUTH.user+" · ":"")+"All accounts";
    return;
  }
  var t=totals(a);
  $("#stats").innerHTML =
    card("hero", esc(a.name)+" — balance", fmt(t.bal,a.currency), t.bal<0?"neg":"pos", t.n+(t.n===1?" entry":" entries")+" · opening "+fmt(a.opening,a.currency))+
    card("","Money in",fmt(t.in,a.currency),"pos","all credits")+
    card("","Money out",fmt(t.out,a.currency),"neg","all debits")+
    card("","Cash",fmt(t.cash,a.currency),t.cash<0?"neg":"","net cash movement")+

function auditLine(r){

    case "TAG":     return "re-tagged an entry"+acc+what;
    case "DELETE":  return "deleted <b>"+esc(r.note||"an entry")+"</b> ("+esc(r.oldValue)+")"+acc;
    case "RESTORE": return "restored <b>"+esc(r.note||"an entry")+"</b>"+acc;
    case "MOVE":    return "moved <b>"+esc(r.note||"an entry")+"</b> from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>";
    case "SORT":    return "re-sorted"+acc+what;
    case "IMPORT":  return "imported <b>"+esc(r.newValue)+" entries</b>"+acc;
    case "OPENING": return "set the opening balance"+acc+" from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>";
    case "ACCOUNT_ADD": return "created the account <b>"+esc(r.newValue)+"</b>";
    case "ACCOUNT_DEL": return "deleted the account <b>"+esc(r.oldValue)+"</b>";
    case "ACCOUNT_EDIT":return "changed account <b>"+esc(r.field)+"</b> from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>";
    case "RECEIVABLE_ADD": return "added a receivable"+acc+" — "+esc(r.note)+" ("+esc(r.newValue)+")";
    case "PAYABLE_ADD":    return "added a payable"+acc+" — "+esc(r.note)+" ("+esc(r.newValue)+")";
    case "RECEIVABLE_SETTLED": return "marked <b>"+esc(r.note)+"</b> as received"+acc;
    case "PAYABLE_SETTLED":    return "marked <b>"+esc(r.note)+"</b> as paid"+acc;
    case "RECEIVABLE_REMOVED": return "removed the receivable <b>"+esc(r.note)+"</b>"+acc;
    case "PAYABLE_REMOVED":    return "removed the payable <b>"+esc(r.note)+"</b>"+acc;
    case "LOGIN":   return "signed in";

function canUndo(r){
  if(!r) return false;
  switch(r.action){
    case "ADD": case "DELETE": case "RESTORE": return !!r.entryId;
    case "EDIT": case "TAG": return !!r.entryId && !!r.field;
    case "MOVE": return !!r.entryId && !!r.oldValue;
    case "OPENING": return !!r.account;
    case "ACCOUNT_EDIT": return !!r.account && !!r.field;
    default: return false;
  }
}
function undoQuestion(r){
  var who=(r.user===AUTH.user?"your":esc(r.user)+"'s")+" change";
  switch(r.action){
    case "ADD":     return "Undo "+who+"?\n\nThe entry \u201c"+(r.note||"")+"\u201d will be deleted (it stays in History).";
    case "DELETE":  return "Undo "+who+"?\n\nThe deleted entry \u201c"+(r.note||"")+"\u201d comes back.";
    case "RESTORE": return "Undo "+who+"?\n\nThe entry \u201c"+(r.note||"")+"\u201d will be deleted again.";
    case "TAG":     return "Undo "+who+"?\n\nThe colour tag goes back to what it was.";
    case "EDIT":    return r.field==="pos"
        ? "Undo "+who+"?\n\nThe row goes back to where it was in the list."
        : "Undo "+who+"?\n\n"+r.field+" goes back from "+r.newValue+" to "+r.oldValue+".";
    case "MOVE":    return "Undo "+who+"?\n\nThe entry goes back to "+r.oldValue+".";
    case "OPENING": return "Undo "+who+"?\n\nThe opening balance of "+r.account+" goes back to "+r.oldValue+".";
    case "ACCOUNT_EDIT": return "Undo "+who+"?\n\n"+r.account+" "+r.field+" goes back to "+r.oldValue+".";
  }
  return "Undo this change?";
}
function undoAudit(r){
  if(!canUndo(r)) return;
  var id=r.entryId;
  var needsEntry = ["EDIT","TAG","MOVE"].indexOf(r.action)>-1;
  if(needsEntry && !DB.entries[id]) return toast("That entry no longer exists — it was deleted");
  if(!confirm(undoQuestion(r))) return;

  if(r.action==="ADD" || r.action==="RESTORE"){
    delete DB.entries[id]; op({t:"delete", id:id});
  }
  else if(r.action==="DELETE"){
    op({t:"restore", id:id});
  }
  else if(r.action==="EDIT" || r.action==="TAG"){
    var f=r.field, v=r.oldValue;
    if(f==="amount"||f==="pos") v=Number(v)||0;
    else if(f==="date") v=parseDate(v)||"";
    else v=(v==null?"":String(v));
    DB.entries[id][f]=v;
    op({t:"update", id:id, field:f, val:v, old:r.newValue});
  }
  else if(r.action==="MOVE"){
    var target=S.accounts.filter(function(a){ return String(a.name)===String(r.oldValue); })[0];
    if(!target) return toast("The account \u201c"+r.oldValue+"\u201d no longer exists");
    DB.entries[id].accountId=target.id;
    op({t:"move", id:id, toAccount:target.id});
  }
  else if(r.action==="OPENING" || r.action==="ACCOUNT_EDIT"){
    var acc=S.accounts.filter(function(a){ return String(a.name)===String(r.account); })[0];
    if(!acc) return toast("The account \u201c"+r.account+"\u201d no longer exists");
    var af=(r.action==="OPENING")?"opening":r.field, av=r.oldValue;
    if(af==="opening"||af==="pos") av=Number(av)||0; else av=(av==null?"":String(av));
    DB.accounts[acc.id][af]=av;
    op({t:"account", op:"edit", id:acc.id, field:af, val:av, old:r.newValue});
  }
  rebuild(); renderAll();
  toast("Undone — the undo is recorded in History too");
}

/* ======================================================= SELECT / BULK === */
function pickCount(){ return Object.keys(PICK).length; }
function clearPick(){ PICK={}; ui.lastPick=null; renderBulk(); syncSelAllBox(); }
function togglePick(id, shift){
  var a=acct(), rows=filtered(a);
  if(shift && ui.lastPick){
    var i=-1,j=-1;
    rows.forEach(function(e,k){ if(e.id===ui.lastPick) i=k; if(e.id===id) j=k; });
    if(i>-1&&j>-1){
      var lo=Math.min(i,j), hi=Math.max(i,j);
      for(var k=lo;k<=hi;k++) PICK[rows[k].id]=1;
      ui.lastPick=id; renderTable(); renderBulk(); return;
    }
  }
  if(PICK[id]) delete PICK[id]; else PICK[id]=1;
  ui.lastPick=id;
  paintPick(id); renderBulk(); syncSelAllBox();
}
function paintPick(id){
  var tr=$('#tbody tr[data-id="'+id+'"]'); if(!tr) return;
  tr.classList.toggle("picked", !!PICK[id]);
  var cb=tr.querySelector("[data-pick]"); if(cb) cb.checked=!!PICK[id];
}
function selectAll(on){
  var rows=filtered(acct());
  rows.forEach(function(e){ if(on) PICK[e.id]=1; else delete PICK[e.id]; });
  if(!on) PICK={};
  renderTable(); renderBulk();
}
function syncSelAllBox(){
  var box=$("#sel-all-box"); if(!box) return;
  var rows=filtered(acct()), n=0;
  rows.forEach(function(e){ if(PICK[e.id]) n++; });
  box.checked = rows.length>0 && n===rows.length;
  box.indeterminate = n>0 && n<rows.length;
}

function bulkTag(tag){

    if(!DB.entries[id]) return;

function bulkMove(toId){

  if(!target) return;

    op({t:"move", id:id, toAccount:toId});
  });

function bulkDelete(){
  var ids=Object.keys(PICK);
  if(!confirm("Delete "+ids.length+" entr"+(ids.length===1?"y":"ies")+"?\n\nThey stay in History and can be restored.")) return;
  ids.forEach(function(id){ delete DB.entries[id]; op({t:"delete", id:id}); });
  clearPick(); rebuild(); renderAll();
  toast(ids.length+" entries deleted — restore them from History");
}

/* ============================================================== EDIT ===== */
function findEntry(id){
  var a=acct();
  for(var i=0;i<a.entries.length;i++) if(a.entries[i].id===id) return a.entries[i];
  return null;
}
function startEdit(td){
  if(drag) return;
  if(td.querySelector(".edit")) return;
  var tr=td.closest("tr"); if(!tr||tr.classList.contains("opening")) return;
  var e=findEntry(tr.dataset.id); if(!e) return;
  var field=td.dataset.field, el;
  if(field==="date"){ el=document.createElement("input"); el.type="date"; el.value=e.date||todayISO(); }
  else if(field==="payBy"){
    el=document.createElement("select");
    ["CASH","BANK","CHEQUE","CARD","OTHER"].forEach(function(o){ var op=document.createElement("option"); op.textContent=o; el.appendChild(op); });
    el.value=String(e.payBy||"CASH").toUpperCase();
  }
  else if(field==="amount"){ el=document.createElement("input"); el.type="text"; el.inputMode="decimal"; el.value=String(e.amount); el.className="amt"; }
  else { el=document.createElement("textarea"); el.value=e.details||""; }
  el.className="edit "+(el.className||"");
  var done=false;
  function commit(){
    if(done) return; done=true;
    var val=el.value, old=e[field], changed=false;
    if(field==="amount"){ var n=parseAmount(val); if(!isNaN(n)&&n!==e.amount){ e.amount=n; changed=true; } }
    else if(field==="date"){ if(val&&val!==e.date){ e.date=val; changed=true; } }
    else if(val!==e[field]){ e[field]=val; changed=true; }
    if(changed){
      if(DB.entries[e.id]){ DB.entries[e.id][field]=e[field]; DB.entries[e.id].updatedBy=AUTH.user; DB.entries[e.id].updatedAt=new Date().toISOString(); }
      op({t:"update", id:e.id, field:field, val:e[field], old:old});
    }
    renderTable(); renderStats(); renderTabs(); renderMonths();
  }
  el.addEventListener("blur",commit);
  el.addEventListener("keydown",function(ev){
    if(ev.key==="Escape"){ ev.preventDefault(); done=true; renderTable(); }
    else if(ev.key==="Enter"&&(field!=="details"||!ev.shiftKey)){ ev.preventDefault(); el.blur(); }
  });
  td.textContent=""; td.appendChild(el); el.focus(); if(el.select) el.select();
}
function editOpening(td){
  if(td.querySelector(".edit")) return;
  var a=acct(), el=document.createElement("input");
  el.type="text"; el.inputMode="decimal"; el.className="edit amt"; el.value=String(a.opening);
  var done=false;
  function commit(){
    if(done) return; done=true;
    var n=parseAmount(el.value);
    if(!isNaN(n)&&n!==a.opening){
      var old=a.opening; a.opening=n;
      if(DB.accounts[a.id]) DB.accounts[a.id].opening=n;
      op({t:"account", op:"edit", id:a.id, field:"opening", val:n, old:old});
    }
    renderAll();
  }
  el.addEventListener("blur",commit);
  el.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ev.preventDefault();el.blur();} if(ev.key==="Escape"){done=true;renderTable();} });
  td.textContent=""; td.appendChild(el); el.focus(); el.select();
}

/* ------------------------------------------------------------- reordering */
function moveRow(id, dir){
  if(filtersOn()) return toast("Clear the filters first, then reorder");
  var a=acct(), list=a.entries;
  var i=-1; for(var k=0;k<list.length;k++) if(list[k].id===id) i=k;
  var j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  var A=DB.entries[list[i].id], B=DB.entries[list[j].id];
  if(!A||!B) return;
  var pa=Number(A.pos)||0, pb=Number(B.pos)||0;
  if(pa===pb) pb = pa + dir*0.5;
  A.pos=pb; B.pos=pa;
  op({t:"update", id:A.id, field:"pos", val:pb, old:pa});
  op({t:"update", id:B.id, field:"pos", val:pa, old:pb});
  var sc=$("#tablewrap").scrollTop;
  rebuild(); renderTable(); renderStats();
  $("#tablewrap").scrollTop=sc;
  var tr=$('#tbody tr[data-id="'+id+'"]');
  if(tr){ tr.classList.add("flash"); setTimeout(function(){tr.classList.remove("flash");},900); }
}

/* --------------------------------------------------------- drag to reorder */
var drag=null, dragRaf=null, dragY=0;
function startDrag(ev,id){
  if(filtersOn()){ toast("Clear the filters first, then drag"); return; }
  var tr=$('#tbody tr[data-id="'+id+'"]'); if(!tr) return;
  ev.preventDefault();
  drag={id:id, tr:tr, moved:false};
  dragY=ev.clientY;
  tr.classList.add("dragging");
  document.body.classList.add("dragging-row");
  if(navigator.vibrate) navigator.vibrate(8);
  window.addEventListener("pointermove",onDragMove,{passive:false});
  window.addEventListener("pointerup",endDrag);
  window.addEventListener("pointercancel",endDrag);
  dragRaf=requestAnimationFrame(edgeScroll);
}
function onDragMove(ev){
  if(!drag) return;
  ev.preventDefault();
  dragY=ev.clientY; drag.moved=true;
  var el=document.elementFromPoint(ev.clientX, ev.clientY);
  var over=el&&el.closest?el.closest('#tbody tr[data-id]'):null;
  if(over&&over!==drag.tr){
    var r=over.getBoundingClientRect();
    if(ev.clientY < r.top+r.height/2) over.parentNode.insertBefore(drag.tr, over);
    else over.parentNode.insertBefore(drag.tr, over.nextSibling);
  }
}
function edgeScroll(){
  if(!drag) return;
  var tw=$("#tablewrap"), edge=70, step=14;
  var scroller = tw.scrollHeight>tw.clientHeight+2 ? tw : null;
  var top, bottom;
  if(scroller){ var r=scroller.getBoundingClientRect(); top=r.top; bottom=r.bottom; }
  else { top=0; bottom=window.innerHeight; }
  if(dragY<top+edge){ if(scroller) scroller.scrollTop-=step; else window.scrollBy(0,-step); }
  else if(dragY>bottom-edge){ if(scroller) scroller.scrollTop+=step; else window.scrollBy(0,step); }
  dragRaf=requestAnimationFrame(edgeScroll);
}
function endDrag(){
  window.removeEventListener("pointermove",onDragMove);
  window.removeEventListener("pointerup",endDrag);
  window.removeEventListener("pointercancel",endDrag);
  if(dragRaf) cancelAnimationFrame(dragRaf);
  var d=drag; drag=null;
  document.body.classList.remove("dragging-row");
  if(!d) return;
  d.tr.classList.remove("dragging");
  if(d.moved) commitDrag(d.id);
}
/* only the dragged row gets a new position — one small write, not a re-numbering */
function commitDrag(id){
  var ids=$$("#tbody tr[data-id]").map(function(tr){return tr.dataset.id;});
  var i=ids.indexOf(id); if(i<0) return;
  var cur=DB.entries[id]; if(!cur) return;
  var prev=i>0?DB.entries[ids[i-1]]:null, next=i<ids.length-1?DB.entries[ids[i+1]]:null;
  var p;
  if(!prev&&!next) return;
  else if(!prev) p=(Number(next.pos)||0)-1;
  else if(!next) p=(Number(prev.pos)||0)+1;
  else {
    var a=Number(prev.pos)||0, b=Number(next.pos)||0;
    p=(a+b)/2;
    if(p===a||p===b) p=a+0.0001;
  }
  if(p===Number(cur.pos)){ renderTable(); return; }
  var old=cur.pos; cur.pos=p;
  op({t:"update", id:id, field:"pos", val:p, old:old});
  rebuild(); renderTable(); renderStats();
  var tr=$('#tbody tr[data-id="'+id+'"]');
  if(tr){ tr.classList.add("flash"); setTimeout(function(){tr.classList.remove("flash");},900); }
}

/* --------------------------------------------- split 50/50 across two accounts */
function splitPair(){
  var out=[];
  SPLIT_ACCOUNTS.forEach(function(n){
    var a=S.accounts.filter(function(x){ return String(x.name||"").trim().toUpperCase()===n.toUpperCase(); })[0];
    if(a) out.push(a);
  });
  return out.length===SPLIT_ACCOUNTS.length ? out : null;
}
function halves(v){
  v=Number(v)||0;
  var a=Math.round(v*50)/100;                 // half, to the fils
  return [a, Math.round((v-a)*100)/100];      // remainder, so the two always add back up
}
function splitOption(){
  return splitPair() ? '<option value="__SPLIT__">'+esc(SPLIT_ACCOUNTS.join(" + "))+' — split 50/50</option>' : '';
}
function splitEntries(ids){
  var pair=splitPair();
  if(!pair) return toast("Both "+SPLIT_ACCOUNTS.join(" and ")+" accounts are needed for that");
  var from=acct(), cur=from.currency;
  var list=ids.map(function(id){ return findEntry(id); }).filter(Boolean);
  if(!list.length) return;
  var msg;
  if(list.length===1){
    var h=halves(list[0].amount);
    msg="Split "+fmt(list[0].amount,cur)+" between two accounts?\n\n"+
        pair[0].name+"   "+fmt(h[0],cur)+"\n"+pair[1].name+"   "+fmt(h[1],cur)+
        "\n\nThe entry is removed from "+from.name+".";
  } else {
    var tot=list.reduce(function(s2,e){ return s2+(Number(e.amount)||0); },0);
    msg="Split "+list.length+" entries ("+fmt(tot,cur)+") 50/50 between "+pair[0].name+" and "+pair[1].name+
        "?\n\nThey are removed from "+from.name+".";
  }
  if(!confirm(msg)) return;

  var base=[pair[0].entries.reduce(function(m,x){return Math.min(m,x.pos);},0),
            pair[1].entries.reduce(function(m,x){return Math.min(m,x.pos);},0)];
  var made=[], originals=list.slice();
  list.forEach(function(e){
    var h=halves(e.amount);
    pair.forEach(function(t,i){
      base[i]-=1;
      var c={id:uid(), accountId:t.id, date:e.date, details:e.details, payBy:e.payBy, amount:h[i], tag:e.tag};
      DB.entries[c.id]=Object.assign({pos:base[i], deleted:"", createdBy:AUTH.user, createdAt:new Date().toISOString(),
        updatedBy:AUTH.user, updatedAt:new Date().toISOString()}, c);
      op({t:"addEntry", e:c});
      made.push(c.id);
    });
    delete DB.entries[e.id];
    op({t:"delete", id:e.id});
  });
  clearPick(); rebuild(); renderAll();
  toast(list.length+(list.length===1?" entry":" entries")+" split between "+pair[0].name+" and "+pair[1].name,
    function(){
      made.forEach(function(id){ delete DB.entries[id]; op({t:"delete", id:id}); });
      originals.forEach(function(e){ op({t:"restore", id:e.id}); });
      rebuild(); renderAll(); toast("Split undone");
    });
}

/* -------------------------------------------------- insert a blank row here */
function insertBlank(refId, where){
  if(isAll()) return;
  if(filtersOn()) return toast("Clear the filters first, then add a row");
  var a=acct(), list=a.entries;
  var i=-1; for(var k=0;k<list.length;k++) if(list[k].id===refId) i=k;
  if(i<0) return;
  var ref=DB.entries[refId]; if(!ref) return;
  var rp=Number(ref.pos)||0, nb, p;
  if(where==="above"){
    nb = i>0 ? DB.entries[list[i-1].id] : null;
    p = nb ? (rp + (Number(nb.pos)||0))/2 : rp-1;
    if(nb && (p===rp || p===Number(nb.pos))) p = rp-0.0001;
  } else {
    nb = i<list.length-1 ? DB.entries[list[i+1].id] : null;
    p = nb ? (rp + (Number(nb.pos)||0))/2 : rp+1;
    if(nb && (p===rp || p===Number(nb.pos))) p = rp+0.0001;
  }
  var e={id:uid(), accountId:a.id, date:"", details:"", payBy:"CASH", amount:0, tag:""};
  DB.entries[e.id]=Object.assign({pos:p, deleted:"", createdBy:AUTH.user, createdAt:new Date().toISOString(),
    updatedBy:AUTH.user, updatedAt:new Date().toISOString()}, e);
  /* the server always drops a new entry on top, so follow it with the real position */
  op({t:"addEntry", e:e});
  op({t:"update", id:e.id, field:"pos", val:p});
  rebuild(); renderTable(); renderStats(); renderTabs();
  var tr=$('#tbody tr[data-id="'+e.id+'"]');
  if(tr){
    tr.scrollIntoView({block:"nearest"});
    var td=tr.querySelector('td[data-field="details"]');
    if(td && !isTouch()) startEdit(td);
  }
  toast("Blank row added — tap it to fill it in");
}

function openCtx(x,y,id){

  var c=$("#ctx"), others=S.accounts.filter(function(a){return a.id!==S.activeId;});
  c.innerHTML='<div class="lab">Colour tag</div><div class="swatches">'+

    (others.length?'<div class="lab">Move to account</div><div class="wrap"><select id="ctx-move"><option value="">Choose account…</option>'+
      others.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+splitOption()+'</select></div>':'')+
    '<div class="sep"></div>'+
    '<button class="ci" data-act="above">⤒ Add row above</button>'+
    '<button class="ci" data-act="below">⤓ Add row below</button>'+
    '<div class="sep"></div>'+
    '<button class="ci" data-act="up">▲ Move up</button>'+
    '<button class="ci" data-act="down">▼ Move down</button>'+
    '<button class="ci" data-act="top">↑ Send to top</button>'+
    '<div class="sep"></div>'+
    '<button class="ci" data-act="hist">🕘 History of this entry</button>'+
    '<button class="ci" data-act="dup">⧉ Duplicate entry</button>'+
    '<button class="ci" data-act="flip">± Flip sign (in ⇄ out)</button>'+
    '<div class="sep"></div><button class="ci danger" data-act="del">🗑 Delete entry</button>';
  c.classList.add("show");
  if(!isTouch()){
    c.style.left=Math.min(x, innerWidth-c.offsetWidth-10)+"px";
    c.style.top =Math.min(y, innerHeight-c.offsetHeight-10)+"px";
  }
  $$(".sw2",c).forEach(function(b){
    b.onclick=function(){
      e.tag=b.dataset.tag;
      if(DB.entries[e.id]) DB.entries[e.id].tag=e.tag;
      op({t:"update", id:e.id, field:"tag", val:e.tag}); closeCtx(); renderAll();
    };
  });
  var mv=$("#ctx-move",c);
  if(mv) mv.onchange=function(){
    if(mv.value==="__SPLIT__"){ closeCtx(); return splitEntries([e.id]); }
    var target=S.accounts.filter(function(a){return a.id===mv.value;})[0]; if(!target) return;
    if(DB.entries[e.id]) DB.entries[e.id].accountId=target.id;
    op({t:"move", id:e.id, toAccount:target.id});
    closeCtx(); rebuild(); renderAll(); toast("Moved to "+target.name);
  };
  $$(".ci",c).forEach(function(b){
    b.onclick=function(){
      var act=b.dataset.act; closeCtx();
      if(act==="hist") return openHistory(e.id);
      if(act==="up") return moveRow(e.id,-1);
      if(act==="down") return moveRow(e.id,1);
      if(act==="above") return insertBlank(e.id,"above");
      if(act==="below") return insertBlank(e.id,"below");
      if(act==="dup"){
        var dp=e.pos-0.5;
        var copy={id:uid(), accountId:acct().id, date:e.date, details:e.details, payBy:e.payBy, amount:e.amount, tag:e.tag};
        DB.entries[copy.id]=Object.assign({},copy,{pos:dp,createdBy:AUTH.user,createdAt:new Date().toISOString(),updatedBy:AUTH.user,updatedAt:new Date().toISOString()});
        op({t:"addEntry", e:copy});
        op({t:"update", id:copy.id, field:"pos", val:dp});   // keep it next to the original
      }
      if(act==="flip"){
        var v=-(Number(e.amount)||0);
        if(DB.entries[e.id]) DB.entries[e.id].amount=v;
        op({t:"update", id:e.id, field:"amount", val:v, old:e.amount});
      }
      if(act==="top"){
        var a=acct(), min=a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0)-1;
        if(DB.entries[e.id]) DB.entries[e.id].pos=min;
        op({t:"update", id:e.id, field:"pos", val:min, old:e.pos});
      }
      if(act==="del"){
        delete DB.entries[e.id];
        op({t:"delete", id:e.id});
        toast("Entry deleted", function(){ op({t:"restore", id:e.id}); });
      }
      rebuild(); renderAll();
    };
  });
}

      '<div class="field"><label>Ambiguous dates</label><select id="im-dmy"><option value="1">31/12/2026 (day first)</option><option value="0">12/31/2026 (month first)</option></select></div>'+

      '<div class="field"><label>Import into</label><select id="im-acct">'+S.accounts.map(function(a){return '<option value="'+a.id+'" '+(a.id===S.activeId?"selected":"")+'>'+esc(a.name)+'</option>';}).join("")+'</select></div>'+
    '</div><div id="im-status" class="hint"></div><div class="prev" id="im-prev" style="display:none"></div>'+
  '</div><footer><span class="hint" id="im-count" style="margin-right:auto"></span><button class="tbtn ghost" data-close>Cancel</button><button class="tbtn primary" id="im-go" disabled>Import</button></footer>');
  var parsed=[], src=$("#im-src");

        s.value=String(guess[i]);

    }
    var map=sels.map(function(s){return +s.value;}), dmy=$("#im-dmy").value==="1";
    parsed=grid.map(function(r){

      var pay=map[2]>=0?String(r[map[2]]||"").trim().toUpperCase():"CASH";
      return {date:d, details:map[1]>=0?String(r[map[1]]||"").trim():"", payBy:pay||"CASH", amount:amt, ok:!!d&&!isNaN(amt), raw:r};

  function doImport(){
    var accountId=$("#im-acct").value;

    });
    var imported=rows.length;
    if(keepTop){                       // two spacer rows travel with the block
      rows.push({id:uid(), date:"", details:"", payBy:"CASH", amount:0, tag:""});
      rows.push({id:uid(), date:"", details:"", payBy:"CASH", amount:0, tag:""});

    var base=a?a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0):0;
    rows.forEach(function(r,i){

        createdBy:AUTH.user, createdAt:new Date().toISOString(), updatedBy:AUTH.user, updatedAt:new Date().toISOString()}, r);
    });

    S.activeId=accountId; closeModal(); rebuild(); renderAll();
