<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HISAAB</title>
<style>
/* ============================ THEME ============================ */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel-2:#fafbfc; --ink:#111827; --ink-2:#4b5563; --ink-3:#8a94a6;
  --line:#e4e8ee; --line-2:#eef1f5; --accent:#1f6feb; --accent-soft:#e8f0fe;
  --pos:#0f8a4a; --pos-soft:#e7f6ed; --neg:#c0392b; --neg-soft:#fdecea;
  --warn:#b45309; --warn-soft:#fff5e0;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  --radius:12px;
  --t-blue:#2563eb; --t-blue-s:#dceaff;
  --t-red:#dc2626;  --t-red-s:#fbdedd;
  --t-green:#16a34a;--t-green-s:#d9f2e1;
  --t-amber:#d97706;--t-amber-s:#fcedcd;
  --t-purple:#7c3aed;--t-purple-s:#eae0ff;
  --t-teal:#0d9488; --t-teal-s:#d5efeb;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1a212b; --ink:#e6edf3; --ink-2:#a9b4c0; --ink-3:#71808f;
  --line:#262d38; --line-2:#1f2630; --accent:#5b9dff; --accent-soft:#16233a;
  --pos:#4ade80; --pos-soft:#12271b; --neg:#ff7b72; --neg-soft:#2a1616;
  --warn:#fbbf24; --warn-soft:#2b2110;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.7);
  --t-blue:#7aa9ff; --t-blue-s:#16233d;
  --t-red:#ff8b82;  --t-red-s:#33191a;
  --t-green:#5cd68a;--t-green-s:#122a1c;
  --t-amber:#f0b74a;--t-amber-s:#302512;
  --t-purple:#b48cff;--t-purple-s:#241a3d;
  --t-teal:#4dd6c4; --t-teal-s:#11302d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13.5px; -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.spacer{flex:1}

/* ============================ LOGIN ============================ */
#gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 50% -10%, #1e293b, #0b1220);padding:22px}
#gate.show{display:flex}
.gatecard{width:min(400px,100%);background:#fff;border-radius:18px;padding:30px 30px 24px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.7);text-align:center;color:#111827}
.gatecard .mark{width:52px;height:52px;border-radius:15px;margin:0 auto 14px;
  background:linear-gradient(140deg,#1f6feb,#7c3aed);display:grid;place-items:center;color:#fff;font-size:23px;font-weight:800}
.gatecard h1{margin:0;font-size:19px;letter-spacing:.18em;font-weight:800}
.gatecard p{margin:6px 0 20px;font-size:12.5px;color:#6b7280}
.gatecard input{width:100%;height:46px;border:1.5px solid #e5e7eb;border-radius:11px;padding:0 14px;
  font-size:16px;text-align:center;letter-spacing:.28em;outline:none;background:#f9fafb;color:#111827}
.gatecard input:focus{border-color:#1f6feb;background:#fff;box-shadow:0 0 0 4px rgba(31,111,235,.14)}
.gatecard button.go{width:100%;height:44px;margin-top:12px;border-radius:11px;background:#111827;color:#fff;font-weight:700;letter-spacing:.04em}
.gatecard button.go:hover{background:#1f6feb}
.gatecard button.go:disabled{opacity:.55;cursor:default}
.gateerr{min-height:18px;margin-top:11px;font-size:12.5px;color:#c0392b;font-weight:600}
.gatefoot{margin-top:16px;font-size:11px;color:#9ca3af;line-height:1.6}
.gatefoot a{color:#6b7280}

/* ============================ SHELL ============================ */
#app{display:none;flex-direction:column;height:100vh}
#app.show{display:flex}
.topbar{display:flex;align-items:center;gap:12px;padding:0 14px;height:52px;flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:12.5px}
.brand .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#7c3aed);display:grid;place-items:center;color:#fff;font-size:13px;letter-spacing:0;font-weight:800}
.brand small{display:block;font-weight:500;letter-spacing:.02em;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;color:var(--ink-2);font-size:12.5px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.tbtn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
.tbtn.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08);background:var(--accent);color:#fff}
.tbtn.ghost{border:1px solid var(--line)}

/* presence */
.people{display:flex;align-items:center;gap:5px}
.who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;
  position:relative;border:2px solid var(--panel);letter-spacing:0}
.who.off{opacity:.34;filter:grayscale(.6)}
.who.me::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;background:var(--pos);border:2px solid var(--panel)}
.sync{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-3)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos);font-style:normal}
.sync.saving i{background:var(--warn);animation:pulse 1s infinite}
.sync.off i{background:var(--neg)}
.sync.off{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,transparent)}
@keyframes pulse{50%{opacity:.25}}

/* tabs */
.tabbar{display:flex;align-items:stretch;gap:2px;padding:0 10px;height:40px;flex:0 0 auto;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 13px;border-radius:8px 8px 0 0;color:var(--ink-3);font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel-2)}
.tab .bal{font-weight:500;font-size:11.5px;color:var(--ink-3)}
.tab.active .bal{color:var(--accent)}
.tab .bal.neg{color:var(--neg)}

.banner{display:none;align-items:center;gap:10px;padding:8px 16px;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--line);font-size:12.5px;font-weight:500;flex:0 0 auto}
.banner.show{display:flex}
.banner .tbtn{color:var(--warn);border-color:currentColor;height:26px}

.stats{display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:10px;padding:12px 16px 0;flex:0 0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow)}
.card .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.card .v{font-size:19px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.card .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.card.hero{background:linear-gradient(135deg,var(--panel),var(--panel-2))}
.card.hero .v{font-size:27px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)}

.work{display:flex;gap:12px;padding:12px 16px 14px;flex:1 1 auto;min-height:0}
.ledger{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.side{flex:0 0 306px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding-right:2px}
@media(max-width:1220px){.side{display:none}.stats{grid-template-columns:1.4fr repeat(2,1fr)}}

.toolbar{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel-2);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 9px;height:30px;min-width:180px;flex:1 1 180px;max-width:300px}
.search input{border:none;background:none;outline:none;width:100%;font-size:12.5px}
.search svg{flex:0 0 auto;opacity:.5}
.chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--panel)}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip .sw{width:8px;height:8px;border-radius:50%;background:currentColor}
select.mini{height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 6px;font-size:12px;outline:none}

.addrow{display:flex;gap:7px;align-items:center;padding:9px 11px;background:var(--accent-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.addrow input,.addrow select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 9px;outline:none;font-size:13px}
.addrow input:focus,.addrow select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
#f-det{flex:1 1 240px;min-width:150px}
#f-amt{width:130px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
#f-date{width:145px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:32px;background:var(--panel)}
.seg button{padding:0 12px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
.seg button.on[data-sign="-1"]{background:var(--neg-soft);color:var(--neg)}
.seg button.on[data-sign="1"]{background:var(--pos-soft);color:var(--pos)}

.tablewrap{flex:1 1 auto;overflow:auto;min-height:0}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;text-align:left;padding:8px 12px;white-space:nowrap}
tbody td{padding:7px 12px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.42}
tbody tr:hover td{background:var(--panel-2)}
.c-date{width:132px;white-space:nowrap;color:var(--ink-2);font-size:12.5px}
.c-pay{width:82px}
.c-amt{width:148px;text-align:right;font-weight:600;white-space:nowrap}
.c-bal{width:140px;text-align:right;color:var(--ink-3);white-space:nowrap;font-size:12.5px}
.c-act{width:34px;text-align:center;color:var(--ink-3)}
.c-det{word-break:break-word}
.amt.pos{color:var(--pos)} .amt.neg{color:var(--neg)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);color:var(--ink-2);background:var(--panel)}
.pill.bank{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
tbody tr[data-tag] td:first-child{position:relative}
tbody tr[data-tag] td:first-child::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tagc)}
tr.t-blue{--tagc:var(--t-blue)}   tr.t-blue td{background:var(--t-blue-s)}
tr.t-red{--tagc:var(--t-red)}     tr.t-red td{background:var(--t-red-s)}
tr.t-green{--tagc:var(--t-green)} tr.t-green td{background:var(--t-green-s)}
tr.t-amber{--tagc:var(--t-amber)} tr.t-amber td{background:var(--t-amber-s)}
tr.t-purple{--tagc:var(--t-purple)} tr.t-purple td{background:var(--t-purple-s)}
tr.t-teal{--tagc:var(--t-teal)}   tr.t-teal td{background:var(--t-teal-s)}
tr.opening td{background:var(--panel-2)!important;font-weight:600;color:var(--ink-2);border-top:2px solid var(--line)}
@keyframes flash{0%{background:color-mix(in srgb,var(--accent) 34%,transparent)}100%{background:transparent}}
tr.flash td{animation:flash 1.7s ease-out}
td .edit{width:100%;border:1px solid var(--accent);border-radius:6px;padding:4px 7px;outline:none;background:var(--panel);font-size:13px;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
td .edit.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
textarea.edit{resize:vertical;min-height:56px;line-height:1.42}
.empty{padding:56px 20px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink-2);margin:0 0 6px;font-size:15px}
.footnote{padding:7px 12px;border-top:1px solid var(--line);background:var(--panel-2);color:var(--ink-3);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;flex:0 0 auto}
.panel h4{margin:0;padding:9px 12px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.panel h4 .tot{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:700}
.panel h4 .tot.recv{color:var(--pos)} .panel h4 .tot.pay{color:var(--neg)}
.panel h4 .lnk{font-size:11px;letter-spacing:0;text-transform:none;color:var(--accent);font-weight:600;cursor:pointer}
.plist{max-height:200px;overflow:auto}
.pitem{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.pitem .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.pitem .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pitem .x,.pitem .ok{opacity:0;color:var(--ink-3);font-size:14px;line-height:1;padding:2px 3px;border-radius:5px}
.pitem:hover .x,.pitem:hover .ok{opacity:1}
.pitem .ok:hover{color:var(--pos);background:var(--pos-soft)}
.pitem .x:hover{color:var(--neg);background:var(--neg-soft)}
.padd{display:flex;gap:6px;padding:8px 10px}
.padd input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:0 8px;outline:none;font-size:12.5px}
.padd input.a{flex:0 0 84px;text-align:right}
.padd button{flex:0 0 28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:6px 12px;font-size:12.5px;border-bottom:1px solid var(--line-2)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--ink-3)}
.kv b{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer}
.lg i{width:9px;height:9px;border-radius:50%;font-style:normal}

/* activity feed */
.feed{max-height:340px;overflow:auto}
.fi{display:flex;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line-2);font-size:12px;line-height:1.45}
.fi .av{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:8.5px;font-weight:800;margin-top:1px}
.fi .tx{flex:1;min-width:0;color:var(--ink-2);overflow-wrap:anywhere}
.fi .tx b{color:var(--ink);font-weight:600}
.fi .tm{color:var(--ink-3);font-size:10.5px;white-space:nowrap;margin-top:2px}
.fi .old{color:var(--neg);text-decoration:line-through;opacity:.75}
.fi .new{color:var(--pos);font-weight:600}

.ctx{position:fixed;z-index:80;min-width:224px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px -8px rgba(16,24,40,.28);padding:5px;display:none}
.ctx.show{display:block}
.ctx .ci{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:12.5px;width:100%;text-align:left;color:var(--ink-2)}
.ctx .ci:hover{background:var(--panel-2);color:var(--ink)}
.ctx .ci.danger:hover{background:var(--neg-soft);color:var(--neg)}
.ctx .sep{height:1px;background:var(--line);margin:5px 3px}
.ctx .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:4px 9px 2px;font-weight:700}
.ctx .swatches{display:flex;gap:6px;padding:4px 9px 8px;flex-wrap:wrap}
.ctx .sw2{width:22px;height:22px;border-radius:6px;border:2px solid transparent;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.ctx .sw2.on{border-color:var(--ink)}
.ctx select{width:100%;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);padding:0 7px;margin:2px 0 4px;outline:none;font-size:12.5px}
.ctx .wrap{padding:0 9px 4px}

.scrim{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:90;display:none;align-items:center;justify-content:center;padding:24px}
.scrim.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);width:min(940px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:15px;font-weight:700}
.modal header p{margin:3px 0 0;font-size:12px;color:var(--ink-3)}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel-2)}
.modal textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;resize:vertical}
.modal textarea:focus{border-color:var(--accent)}
.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:12px 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.field select,.field input{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 8px;outline:none;font-size:12.5px;min-width:120px}
.prev{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.prev table td,.prev table th{font-size:12px;padding:5px 9px}
.prev tr.bad td{background:var(--neg-soft);color:var(--neg)}
.hint{font-size:12px;color:var(--ink-3);line-height:1.6}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;font-family:ui-monospace,monospace;background:var(--panel-2);color:var(--ink-2)}
.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.helprow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2)}
.acctrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.acctrow input{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:0 8px;outline:none;font-size:12.5px}
.acctrow input.nm{flex:1}
.acctrow input.ob{width:130px;text-align:right}
.htable{width:100%;font-size:12.5px}
.htable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.htable td{padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);z-index:100;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:500;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:80vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .u{color:#facc15;font-weight:700;cursor:pointer;pointer-events:auto;margin-left:10px}

  body{overflow:visible;background:#fff}
  .topbar,.tabbar,.toolbar,.addrow,.side,.banner,.c-act,.footnote,#toast{display:none!important}
  .work,.stats{padding:0}
  .ledger,.card{box-shadow:none;border-color:#ddd}
  .tablewrap{overflow:visible}
  #app{height:auto}
}

<!-- ============================== LOGIN ============================== -->

    <p id="gate-sub">Enter your password to continue</p>
    <input id="gate-pw" type="password" autocomplete="current-password" placeholder="••••" autofocus>

  <div class="topbar">
    <div>SIAM HISAAB<small id="brandsub">Accounts Ledger</small></div></div>

  <div class="work">

<script>
"use strict";
/* ===========================================================================
   HISAAB — client.  Talks to the Google Apps Script backend (Code.gs).
   =========================================================================== */

/*  ▼▼▼  PASTE YOUR APPS SCRIPT WEB APP URL BETWEEN THE QUOTES  ▼▼▼  */
var API_URL = "https://script.google.com/macros/s/AKfycbwdE7x-eQCzLaGlB_P5gJMCvlt_e83QQADldacZMd9krwlHCkJ03ZkmeRRu0Hiynlsb/exec";
/*  It looks like: https://script.google.com/macros/s/AKfy..../exec              */

var LS = "hisaab.v2";
var TAGS = [
  {id:"blue",  label:"SARIM",       cls:"t-blue",  color:"#2563eb"},
  {id:"red",   label:"SIAM",        cls:"t-red",   color:"#dc2626"},
  {id:"green", label:"BASIL",       cls:"t-green", color:"#16a34a"},
  {id:"amber", label:"SARIM/BASIL", cls:"t-amber", color:"#d97706"},
  {id:"purple",label:"OTHER 1",     cls:"t-purple",color:"#7c3aed"},
  {id:"teal",  label:"OTHER 2",     cls:"t-teal",  color:"#0d9488"}
];
var PERSON_COLORS = ["#2563eb","#16a34a","#d97706","#7c3aed","#0d9488","#dc2626","#db2777","#0891b2"];
var CUR_DEC = {JPY:0, KRW:0};
var $ = function(s,r){return (r||document).querySelector(s);};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ------------------------------------------------------------------ state */
var AUTH = {token:"", user:"", people:[]};
var DB   = {rev:0, since:"", accounts:{}, entries:{}, side:{}, audit:[], online:[]};
var Q    = [];                                   // pending ops waiting to reach the Sheet
var S    = {accounts:[], activeId:null, theme:"light", tagLabels:{}};
var ui   = {q:"", tag:"all", payBy:"all", month:"all"};
var net  = {state:"live", lastErr:"", sending:false, lastPull:0, bannerHidden:false};
var lastActivity = Date.now();
var DEMO = false;                                 // offline try-it mode

/* ------------------------------------------------------------- local cache */
function lsGet(k,d){ try{ var v=localStorage.getItem(LS+"."+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+"."+k, JSON.stringify(v)); }catch(e){} }
function cacheAll(){ lsSet("db",{rev:DB.rev,since:DB.since,accounts:DB.accounts,entries:DB.entries,side:DB.side,audit:DB.audit.slice(0,60)}); lsSet("q",Q); lsSet("ui",{theme:S.theme,activeId:S.activeId,tagLabels:S.tagLabels}); }

/* ------------------------------------------------------------------- utils */
function dec(c){ return CUR_DEC[c]==null?2:CUR_DEC[c]; }
function fmt(n,cur,o){
  cur = cur || (acct()||{}).currency || "AED"; n = Number(n)||0;
  var d = dec(cur), s = Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
  return (n<0?"-":(o&&o.plus&&n>0?"+":"")) + cur + " " + s;
}
function fmtShort(n,cur){
  cur=cur||"AED"; n=Number(n)||0; var a=Math.abs(n),s;
  if(a>=1e6) s=(a/1e6).toFixed(a>=1e7?0:1)+"M"; else if(a>=1e3) s=(a/1e3).toFixed(a>=1e5?0:1)+"K"; else s=a.toFixed(0);
  return (n<0?"-":"")+cur+" "+s;
}
function parseAmount(v){
  if(typeof v==="number") return v;
  var s=String(v==null?"":v).trim(); if(!s) return NaN;
  var neg = /^\(.*\)$/.test(s) || /-/.test(s);
  s=s.replace(/[()]/g,"").replace(/[^0-9.,-]/g,"");
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/,/g,"");
  else if((s.match(/,/g)||[]).length===1 && /,\d{1,2}$/.test(s)) s=s.replace(",",".");
  else s=s.replace(/,/g,"");
  s=s.replace(/-/g,""); var n=parseFloat(s);
  return isNaN(n)?NaN:(neg?-n:n);
}
var MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function pad(n){return (n<10?"0":"")+n;}
function iso(y,m,d){ return y+"-"+pad(m+1)+"-"+pad(d); }
function todayISO(){ var d=new Date(); return iso(d.getFullYear(),d.getMonth(),d.getDate()); }
function parseDate(v,dmy){
  var s=String(v==null?"":v).trim(); if(!s) return ""; var m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return iso(+m[1],+m[2]-1,+m[3]);
  var t=s.replace(/^[A-Za-z]{3,9},\s*/,"");
  if((m=t.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/))){
    var mo=MON[m[1].toLowerCase().slice(0,4)]!=null?MON[m[1].toLowerCase().slice(0,4)]:MON[m[1].toLowerCase().slice(0,3)];
    if(mo!=null) return iso(+m[3],mo,+m[2]);
  }
  if((m=t.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})$/))){
    var mo2=MON[m[2].toLowerCase().slice(0,4)]!=null?MON[m[2].toLowerCase().slice(0,4)]:MON[m[2].toLowerCase().slice(0,3)];
    if(mo2!=null) return iso(+m[3],mo2,+m[1]);
  }
  if((m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))){
    var a=+m[1],b=+m[2],y=+m[3]; if(y<100) y+=2000;
    var day=dmy?a:b, mon=dmy?b:a; if(a>12 && !dmy){day=a;mon=b;}
    if(mon>=1&&mon<=12&&day>=1&&day<=31) return iso(y,mon-1,day);
  }
  var d=new Date(s);
  return isNaN(d.getTime())?"":iso(d.getFullYear(),d.getMonth(),d.getDate());
}
function fmtDate(s){
  if(!s) return "—";
  var p=String(s).split("-"), d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d.getTime())?String(s):d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
}
function fmtWhen(ts){
  if(!ts) return "";
  var d=new Date(ts); if(isNaN(d.getTime())) return String(ts);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})+", "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
}
function ago(ts){
  var d=new Date(ts); if(isNaN(d.getTime())) return "";
  var s=(Date.now()-d.getTime())/1000;
  if(s<45) return "just now";
  if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" h ago";
  if(s<604800) return Math.round(s/86400)+" d ago";
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function monthKey(s){ return s?String(s).slice(0,7):""; }
function monthName(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}); }
function personColor(name){
  var h=0; for(var i=0;i<String(name).length;i++) h=(h*31+String(name).charCodeAt(i))>>>0;
  return PERSON_COLORS[h%PERSON_COLORS.length];
}
function initials(n){ n=String(n||"?").trim(); return n.slice(0,3).toUpperCase(); }
function toast(msg,undoFn){
  var t=$("#toast");
  t.innerHTML=esc(msg)+(undoFn?' <span class="u" id="toast-undo">Undo</span>':"");
  t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("show");}, undoFn?5600:2400);
  if(undoFn) $("#toast-undo").onclick=function(){ undoFn(); t.classList.remove("show"); };
}

/* =========================================================== NETWORK ===== */
function api(action, payload){
  payload = payload||{}; payload.action=action;
  if(action!=="login" && action!=="ping") payload.token=AUTH.token;
  var body = JSON.stringify(payload);
  if(DEMO) return Promise.resolve({ok:false,error:"DEMO"});
  return fetch(API_URL,{method:"POST",body:body,headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .catch(function(err){
      if(body.length>5500) throw err;               // too big for the JSONP fallback
      return jsonp(payload);
    });
}
function jsonp(payload){
  return new Promise(function(res,rej){
    var cb="hcb"+Math.random().toString(36).slice(2), s=document.createElement("script"), done=false;
    var t=setTimeout(function(){ if(!done){done=true;clean();rej(new Error("timeout"));} },25000);
    function clean(){ clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ if(done) return; done=true; clean(); res(d); };
    s.onerror=function(){ if(done) return; done=true; clean(); rej(new Error("network")); };
    s.src=API_URL+(API_URL.indexOf("?")>-1?"&":"?")+"callback="+cb+"&p="+encodeURIComponent(JSON.stringify(payload));
    document.body.appendChild(s);
  });
}
function setNet(state, msg){
  net.state=state; net.lastErr=msg||"";
  var el=$("#sync"); if(!el) return;
  el.className="sync"+(state==="saving"?" saving":"")+(state==="off"?" off":"");
  var pend=Q.length;
  el.querySelector("span").textContent = DEMO ? "Offline demo"
    : state==="off" ? (pend? pend+" waiting" : "Offline")
    : state==="saving" ? (pend? "Saving "+pend+"…" : "Saving…") : "Live";
  var b=$("#banner");
  var show = state==="off" && !net.bannerHidden && !DEMO;
  b.classList.toggle("show", show);
  if(show) $("#banner-txt").innerHTML = "<b>Can't reach the ledger right now.</b> "+
    (pend? pend+" change"+(pend>1?"s are":" is")+" saved on this device and will go up automatically. " : "")+
    (msg? "("+esc(msg)+")" : "");
}

/* ------------------------------------------------------------ merge state */
function ingest(res){
  if(!res) return;
  if(res.rev!=null) DB.rev=res.rev;
  if(res.since) DB.since=res.since;
  if(res.online) DB.online=res.online;
  var flashIds=[];
  (res.accounts||[]).forEach(function(a){ DB.accounts[a.id]=a; });
  (res.entries||[]).forEach(function(e){
    var prev=DB.entries[e.id];
    if(prev && (prev.updatedAt!==e.updatedAt) && e.updatedBy && e.updatedBy!==AUTH.user) flashIds.push(e.id);
    DB.entries[e.id]=e;
  });
  (res.side||[]).forEach(function(s){ DB.side[s.id]=s; });
  (res.deletedEntries||[]).forEach(function(id){ delete DB.entries[id]; });
  (res.deletedSide||[]).forEach(function(id){ delete DB.side[id]; });
  if(res.audit && res.audit.length) DB.audit=res.audit;
  rebuild(); cacheAll(); renderAll();
  flashIds.forEach(function(id){
    var tr=$('#tbody tr[data-id="'+id+'"]');
    if(tr){ tr.classList.add("flash"); setTimeout(function(){ tr.classList.remove("flash"); },1800); }
  });
}
function rebuild(){
  var accs = Object.keys(DB.accounts).map(function(k){return DB.accounts[k];})
    .filter(function(a){ return !isTrue(a.deleted); })
    .sort(function(a,b){ return (Number(a.pos)||0)-(Number(b.pos)||0); });
  var byAcct={};
  accs.forEach(function(a){ byAcct[a.id]={id:a.id,name:a.name,currency:a.currency||"AED",opening:Number(a.opening)||0,pos:a.pos,entries:[],recv:[],pay:[]}; });
  Object.keys(DB.entries).forEach(function(k){
    var e=DB.entries[k], a=byAcct[e.accountId]; if(!a) return;
    a.entries.push({id:e.id,accountId:e.accountId,date:e.date,details:e.details,payBy:e.payBy||"CASH",
      amount:Number(e.amount)||0,tag:e.tag||"",pos:Number(e.pos)||0,
      createdBy:e.createdBy,createdAt:e.createdAt,updatedBy:e.updatedBy,updatedAt:e.updatedAt});
  });
  Object.keys(DB.side).forEach(function(k){
    var s=DB.side[k], a=byAcct[s.accountId]; if(!a) return;
    (s.kind==="pay"?a.pay:a.recv).push({id:s.id,name:s.name,amount:Number(s.amount)||0});
  });
  accs.forEach(function(a){ byAcct[a.id].entries.sort(function(x,y){ return x.pos-y.pos; }); });
  S.accounts = accs.map(function(a){ return byAcct[a.id]; });
  if(!S.activeId || !S.accounts.filter(function(a){return a.id===S.activeId;}).length)
    S.activeId = S.accounts[0] ? S.accounts[0].id : null;
}
function isTrue(v){ return v===true||v==="TRUE"||v==="true"||v===1||v==="1"; }
function acct(){
  var a=S.accounts.filter(function(x){return x.id===S.activeId;})[0];
  if(!a) a=S.accounts[0];
  return a || {id:null,name:"—",currency:"AED",opening:0,entries:[],recv:[],pay:[]};
}

/* ------------------------------------------------------------- op queue -- */
function op(o){
  o.opId = uid();
  Q.push(o); cacheAll();
  setNet(Q.length?"saving":"live");
  flush();
}
var flushTimer=null, backoff=1000;
function flush(){
  if(DEMO || net.sending || !Q.length || !AUTH.token) return;
  net.sending=true; setNet("saving");
  var batch=Q.slice(0,25);
  api("push",{ops:batch, since:DB.since, rev:DB.rev}).then(function(res){
    net.sending=false;
    if(res && res.ok){
      Q = Q.filter(function(o){ return batch.indexOf(o)<0; });
      backoff=1000; cacheAll(); ingest(res);
      setNet(Q.length?"saving":"live");
      if(Q.length) flush();
    } else if(res && res.error==="AUTH"){ signedOut(); }
    else { retry(res && res.message); }
  }).catch(function(err){ net.sending=false; retry(err.message); });
}
function retry(msg){
  setNet("off", msg);
  clearTimeout(flushTimer);
  backoff=Math.min(backoff*1.8, 30000);
  flushTimer=setTimeout(flush, backoff);
}

/* ---------------------------------------------------------------- polling */
function pollTick(){
  if(DEMO || !AUTH.token || document.hidden || net.sending) return;
  var idle = Date.now()-lastActivity;
  var wait = idle>180000 ? 30000 : 6000;
  if(Date.now()-net.lastPull < wait) return;
  net.lastPull=Date.now();
  api("pull",{rev:DB.rev, since:DB.since}).then(function(res){
    if(res && res.ok){
      if(net.state==="off") setNet(Q.length?"saving":"live");
      if(res.changed) ingest(res);
      else { DB.online=res.online||DB.online; renderPeople(); }
      if(Q.length) flush();
    } else if(res && res.error==="AUTH"){ signedOut(); }
  }).catch(function(err){ setNet("off", err.message); });
}
function signedOut(){
  AUTH.token=""; lsSet("token","");
  $("#app").classList.remove("show"); $("#gate").classList.add("show");
  $("#gate-err").textContent="Your session expired — sign in again.";
  $("#gate-pw").focus();
}

/* =========================================================== COMPUTE ===== */
function totals(a){
  var bal=Number(a.opening)||0,inn=0,out=0,cash=0,bank=0;
  a.entries.forEach(function(e){
    var v=Number(e.amount)||0; bal+=v; if(v>=0) inn+=v; else out+=v;
    if(String(e.payBy||"").toUpperCase()==="BANK") bank+=v; else cash+=v;
  });
  var r=0,p=0; a.recv.forEach(function(x){r+=x.amount;}); a.pay.forEach(function(x){p+=x.amount;});
  return {bal:bal,in:inn,out:out,cash:cash,bank:bank,recv:r,pay:p,n:a.entries.length};
}
function filtered(a){
  var q=ui.q.trim().toLowerCase();
  return a.entries.filter(function(e){
    if(ui.tag!=="all"){ if(ui.tag==="none"?!!e.tag:e.tag!==ui.tag) return false; }
    if(ui.payBy!=="all" && String(e.payBy||"").toUpperCase()!==ui.payBy) return false;
    if(ui.month!=="all" && monthKey(e.date)!==ui.month) return false;
    if(q && ((e.details||"")+" "+(e.payBy||"")+" "+fmtDate(e.date)+" "+e.amount).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function filtersOn(){ return !!(ui.q.trim()||ui.tag!=="all"||ui.payBy!=="all"||ui.month!=="all"); }
function tagOf(id){ return TAGS.filter(function(t){return t.id===id;})[0]; }
function tagLabel(id){ return (S.tagLabels&&S.tagLabels[id])||(TAGS.filter(function(t){return t.id===id;})[0]||{}).label||id; }

/* ============================================================ RENDER ===== */
function renderAll(){
  document.documentElement.setAttribute("data-theme", S.theme||"light");
  $("#btn-theme").textContent = S.theme==="dark"?"Light":"Dark";
  renderPeople(); renderTabs(); renderStats(); renderChips(); renderMonths(); renderTable(); renderSide(); renderFeed();
}
function renderPeople(){
  var on={}; (DB.online||[]).forEach(function(o){ on[o.user]=o.since; });
  var list = (AUTH.people&&AUTH.people.length)?AUTH.people:Object.keys(on);
  $("#people").innerHTML = list.map(function(p){
    var isOn = !!on[p] || p===AUTH.user;
    return '<div class="who '+(isOn?"":"off")+(p===AUTH.user?" me":"")+'" style="background:'+personColor(p)+'" title="'+
      esc(p)+(p===AUTH.user?" (you)":"")+" — "+(isOn?"online now":"offline")+'">'+esc(initials(p))+'</div>';
  }).join("");
}
function renderTabs(){
  var el=$("#tabbar");
  el.innerHTML=S.accounts.map(function(a){
    var t=totals(a);
    return '<button class="tab '+(a.id===S.activeId?"active":"")+'" data-id="'+a.id+'">'+esc(a.name)+
      ' <span class="bal num '+(t.bal<0?"neg":"")+'">'+fmtShort(t.bal,a.currency)+'</span></button>';
  }).join("")+'<button class="tab" id="tab-add" style="color:var(--ink-3)">+</button>';
  $$(".tab[data-id]",el).forEach(function(b){
    b.onclick=function(){ S.activeId=b.dataset.id; ui.q="";$("#q").value="";ui.tag="all";ui.payBy="all";ui.month="all";$("#f-payby").value="all"; cacheAll(); renderAll(); };
  });
  $("#tab-add").onclick=addAccount;
}
function renderStats(){
  var a=acct(), t=totals(a);
  $("#stats").innerHTML =
    card("hero", esc(a.name)+" — balance", fmt(t.bal,a.currency), t.bal<0?"neg":"pos", t.n+" entries · opening "+fmt(a.opening,a.currency))+
    card("","Money in",fmt(t.in,a.currency),"pos","all credits")+
    card("","Money out",fmt(t.out,a.currency),"neg","all debits")+
    card("","Cash",fmt(t.cash,a.currency),t.cash<0?"neg":"","net cash movement")+
    card("","Bank",fmt(t.bank,a.currency),t.bank<0?"neg":"","net bank movement");
  $("#brandsub").textContent=AUTH.user?(AUTH.user+" · "+a.name):a.name;
  function card(c,k,v,vc,s){ return '<div class="card '+c+'"><div class="k">'+k+'</div><div class="v num '+vc+'">'+v+'</div><div class="s">'+s+'</div></div>'; }
}
function renderChips(){
  var used={}; acct().entries.forEach(function(e){ if(e.tag) used[e.tag]=true; });
  var html='<button class="chip '+(ui.tag==="all"?"on":"")+'" data-tag="all">All</button>';
  TAGS.forEach(function(t){
    if(!used[t.id] && ui.tag!==t.id) return;
    html+='<button class="chip '+(ui.tag===t.id?"on":"")+'" data-tag="'+t.id+'"><i class="sw" style="background:'+t.color+'"></i>'+esc(tagLabel(t.id))+'</button>';
  });
  if(Object.keys(used).length) html+='<button class="chip '+(ui.tag==="none"?"on":"")+'" data-tag="none">Untagged</button>';
  $("#tagchips").innerHTML=html;
  $$("#tagchips .chip").forEach(function(c){ c.onclick=function(){ ui.tag=c.dataset.tag; renderChips(); renderTable(); }; });
  $("#f-reset").style.display=filtersOn()?"":"none";
  var sel=$("#f-tag"), cur=sel.value;
  sel.innerHTML='<option value="">— tag —</option>'+TAGS.map(function(t){return '<option value="'+t.id+'">'+esc(tagLabel(t.id))+'</option>';}).join("");
  sel.value=cur;
}
function renderMonths(){
  var seen={},list=[];
  acct().entries.forEach(function(e){ var k=monthKey(e.date); if(k&&!seen[k]){seen[k]=1;list.push(k);} });
  list.sort().reverse();
  var sel=$("#f-month");
  sel.innerHTML='<option value="all">All months</option>'+list.map(function(k){return '<option value="'+k+'">'+monthName(k)+'</option>';}).join("");
  sel.value=seen[ui.month]?ui.month:"all"; if(sel.value==="all") ui.month="all";
}
function renderTable(){
  var a=acct(), rows=filtered(a), off=filtersOn();
  var bal={}, run=Number(a.opening)||0;
  for(var i=a.entries.length-1;i>=0;i--){ run+=Number(a.entries[i].amount)||0; bal[a.entries[i].id]=run; }
  var html=rows.map(function(e){
    var t=tagOf(e.tag), v=Number(e.amount)||0;
    var tip = "Added by "+(e.createdBy||"?")+" · "+fmtWhen(e.createdAt)+
      (e.updatedAt&&e.updatedAt!==e.createdAt ? "\nLast edit by "+(e.updatedBy||"?")+" · "+fmtWhen(e.updatedAt) : "");
    return '<tr data-id="'+e.id+'" title="'+esc(tip)+'" '+(t?'data-tag="'+e.tag+'" class="'+t.cls+'"':'')+'>'+
      '<td class="c-date" data-field="date">'+esc(fmtDate(e.date))+'</td>'+
      '<td class="c-det" data-field="details">'+esc(e.details||"")+'</td>'+
      '<td class="c-pay" data-field="payBy"><span class="pill '+(String(e.payBy).toUpperCase()==="BANK"?"bank":"")+'">'+esc(e.payBy||"CASH")+'</span></td>'+
      '<td class="c-amt num amt '+(v<0?"neg":"pos")+'" data-field="amount">'+fmt(v,a.currency,{plus:true})+'</td>'+
      '<td class="c-bal num">'+(off?"·":esc(fmt(bal[e.id],a.currency)))+'</td>'+
      '<td class="c-act"><button class="rowmenu" data-id="'+e.id+'">⋯</button></td></tr>';
  }).join("");
  if(!off) html+='<tr class="opening"><td class="c-date">Opening</td><td class="c-det">Opening / carried-forward balance</td>'+
    '<td class="c-pay"></td><td class="c-amt num" id="opening-cell">'+esc(fmt(a.opening,a.currency))+'</td>'+
    '<td class="c-bal num">'+esc(fmt(a.opening,a.currency))+'</td><td class="c-act"></td></tr>';
  $("#tbody").innerHTML=html;

  var empty=$("#empty");
  if(!rows.length){
    empty.style.display="";
    empty.innerHTML = a.entries.length
      ? "<h3>No entries match your filters</h3><div>Clear the filters to see all "+a.entries.length+" entries.</div>"
      : "<h3>This account is empty</h3><div>Add an entry above, or use <b>⊕ Import</b> to paste rows straight out of Google Sheets.</div>";
  } else empty.style.display="none";

  var fin=0,fout=0,ft=0;
  rows.forEach(function(e){ var v=Number(e.amount)||0; ft+=v; if(v>=0)fin+=v; else fout+=v; });
  $("#footnote").innerHTML = off
    ? '<b>'+rows.length+'</b> of '+a.entries.length+' shown · in <b class="num" style="color:var(--pos)">'+fmt(fin,a.currency)+'</b> · out <b class="num" style="color:var(--neg)">'+fmt(fout,a.currency)+'</b> · net <b class="num">'+fmt(ft,a.currency)+'</b> <span style="color:var(--ink-3)">(running balance hidden while filtering)</span>'
    : '<b>'+a.entries.length+'</b> entries · newest first · click any cell to edit · right-click a row for tags, history, move &amp; delete';
  if(!off){ var oc=$("#opening-cell"); if(oc){ oc.style.cursor="text"; oc.onclick=function(){ editOpening(oc); }; } }
}
function renderSide(){
  var a=acct(), t=totals(a);
  $("#recv-tot").textContent=fmt(t.recv,a.currency);
  $("#pay-tot").textContent=fmt(t.pay,a.currency);
  $("#recv-list").innerHTML = a.recv.length ? a.recv.map(function(x){
    return '<div class="pitem"><span class="nm">'+esc(x.name)+'</span><span class="am num" style="color:var(--pos)">'+fmt(x.amount,a.currency)+
      '</span><button class="ok" data-k="recv" data-id="'+x.id+'" data-act="settle" title="Received — post to ledger">✓</button>'+
      '<button class="x" data-k="recv" data-id="'+x.id+'" data-act="del" title="Remove">✕</button></div>';
  }).join("") : '<div class="pitem" style="color:var(--ink-3)">Nothing outstanding</div>';
  $("#pay-list").innerHTML = a.pay.length ? a.pay.map(function(x){
    return '<div class="pitem"><span class="nm">'+esc(x.name)+'</span><span class="am num" style="color:var(--neg)">'+fmt(x.amount,a.currency)+
      '</span><button class="ok" data-k="pay" data-id="'+x.id+'" data-act="settle" title="Paid — post to ledger">✓</button>'+
      '<button class="x" data-k="pay" data-id="'+x.id+'" data-act="del" title="Remove">✕</button></div>';
  }).join("") : '<div class="pitem" style="color:var(--ink-3)">Nothing owed</div>';
  $$("#recv-list button, #pay-list button").forEach(function(b){ b.onclick=function(){ sideAction(b.dataset.k,b.dataset.id,b.dataset.act); }; });

  var net2=t.bal+t.recv-t.pay;
  $("#position").innerHTML =
    kv("Ledger balance",fmt(t.bal,a.currency))+kv("+ Receivable",fmt(t.recv,a.currency))+kv("− Payable",fmt(t.pay,a.currency))+
    '<div class="kv" style="background:var(--panel-2)"><span style="color:var(--ink)">Net position</span><b class="num" style="color:'+(net2<0?"var(--neg)":"var(--pos)")+'">'+fmt(net2,a.currency)+'</b></div>';
  function kv(k,v){ return '<div class="kv"><span>'+k+'</span><b class="num">'+v+'</b></div>'; }

  $("#legend").innerHTML=TAGS.map(function(t2){
    return '<span class="lg" data-tag="'+t2.id+'" title="Double-click to rename (on this device)"><i style="background:'+t2.color+'"></i>'+esc(tagLabel(t2.id))+'</span>';
  }).join("");
  $$("#legend .lg").forEach(function(l){
    l.onclick=function(){ ui.tag=(ui.tag===l.dataset.tag?"all":l.dataset.tag); renderChips(); renderTable(); };
    l.ondblclick=function(){
      var v=prompt("Rename this colour tag:",tagLabel(l.dataset.tag));
      if(v!=null&&v.trim()){ S.tagLabels[l.dataset.tag]=v.trim().toUpperCase(); cacheAll(); renderAll(); }
    };
  });
}
function auditLine(r){
  var acc = r.account?' in <b>'+esc(r.account)+'</b>':'';
  var what = r.note?' — '+esc(String(r.note).slice(0,70)):'';
  switch(r.action){
    case "ADD":     return "added <b>"+esc(r.note||"an entry")+"</b> ("+esc(r.newValue)+")"+acc;
    case "EDIT":    return "changed <b>"+esc(r.field)+"</b>"+acc+" from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>"+what;
    case "TAG":     return "re-tagged an entry"+acc+what;
    case "DELETE":  return "deleted <b>"+esc(r.note||"an entry")+"</b> ("+esc(r.oldValue)+")"+acc;
    case "RESTORE": return "restored <b>"+esc(r.note||"an entry")+"</b>"+acc;
    case "MOVE":    return "moved <b>"+esc(r.note||"an entry")+"</b> from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>";
    case "SORT":    return "re-sorted"+acc+what;
    case "IMPORT":  return "imported <b>"+esc(r.newValue)+" entries</b>"+acc;
    case "OPENING": return "set the opening balance"+acc+" from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>";
    case "ACCOUNT_ADD": return "created the account <b>"+esc(r.newValue)+"</b>";
    case "ACCOUNT_DEL": return "deleted the account <b>"+esc(r.oldValue)+"</b>";
    case "ACCOUNT_EDIT":return "changed account <b>"+esc(r.field)+"</b> from <span class='old'>"+esc(r.oldValue)+"</span> to <span class='new'>"+esc(r.newValue)+"</span>";
    case "RECEIVABLE_ADD": return "added a receivable"+acc+" — "+esc(r.note)+" ("+esc(r.newValue)+")";
    case "PAYABLE_ADD":    return "added a payable"+acc+" — "+esc(r.note)+" ("+esc(r.newValue)+")";
    case "RECEIVABLE_SETTLED": return "marked <b>"+esc(r.note)+"</b> as received"+acc;
    case "PAYABLE_SETTLED":    return "marked <b>"+esc(r.note)+"</b> as paid"+acc;
    case "RECEIVABLE_REMOVED": return "removed the receivable <b>"+esc(r.note)+"</b>"+acc;
    case "PAYABLE_REMOVED":    return "removed the payable <b>"+esc(r.note)+"</b>"+acc;
    case "LOGIN":   return "signed in";
    default:        return esc(r.action)+what;
  }
}
function renderFeed(){
  var rows=(DB.audit||[]).slice(0,25);
  $("#feed").innerHTML = rows.length ? rows.map(function(r){
    return '<div class="fi"><div class="av" style="background:'+personColor(r.user)+'">'+esc(initials(r.user))+'</div>'+
      '<div class="tx"><b>'+esc(r.user)+'</b> '+auditLine(r)+'<div class="tm" title="'+esc(fmtWhen(r.ts))+'">'+esc(ago(r.ts))+'</div></div></div>';
  }).join("") : '<div class="fi" style="color:var(--ink-3)">Nothing yet — changes will appear here as they happen.</div>';
}

/* ============================================================== EDIT ===== */
function findEntry(id){
  var a=acct();
  for(var i=0;i<a.entries.length;i++) if(a.entries[i].id===id) return a.entries[i];
  return null;
}
function startEdit(td){
  if(td.querySelector(".edit")) return;
  var tr=td.closest("tr"); if(!tr||tr.classList.contains("opening")) return;
  var e=findEntry(tr.dataset.id); if(!e) return;
  var field=td.dataset.field, el;
  if(field==="date"){ el=document.createElement("input"); el.type="date"; el.value=e.date||todayISO(); }
  else if(field==="payBy"){
    el=document.createElement("select");
    ["CASH","BANK","CHEQUE","CARD","OTHER"].forEach(function(o){ var op=document.createElement("option"); op.textContent=o; el.appendChild(op); });
    el.value=String(e.payBy||"CASH").toUpperCase();
  }
  else if(field==="amount"){ el=document.createElement("input"); el.type="text"; el.value=String(e.amount); el.className="amt"; }
  else { el=document.createElement("textarea"); el.value=e.details||""; }
  el.className="edit "+(el.className||"");
  var done=false;
  function commit(){
    if(done) return; done=true;
    var val=el.value, old=e[field], changed=false;
    if(field==="amount"){ var n=parseAmount(val); if(!isNaN(n)&&n!==e.amount){ e.amount=n; changed=true; } }
    else if(field==="date"){ if(val&&val!==e.date){ e.date=val; changed=true; } }
    else if(val!==e[field]){ e[field]=val; changed=true; }
    if(changed){
      if(DB.entries[e.id]){ DB.entries[e.id][field]=e[field]; DB.entries[e.id].updatedBy=AUTH.user; DB.entries[e.id].updatedAt=new Date().toISOString(); }
      op({t:"update", id:e.id, field:field, val:e[field], old:old});
    }
    renderTable(); renderStats(); renderTabs(); renderMonths();
  }
  el.addEventListener("blur",commit);
  el.addEventListener("keydown",function(ev){
    if(ev.key==="Escape"){ ev.preventDefault(); done=true; renderTable(); }
    else if(ev.key==="Enter"&&(field!=="details"||!ev.shiftKey)){ ev.preventDefault(); el.blur(); }
  });
  td.textContent=""; td.appendChild(el); el.focus(); if(el.select) el.select();
}
function editOpening(td){
  if(td.querySelector(".edit")) return;
  var a=acct(), el=document.createElement("input");
  el.type="text"; el.className="edit amt"; el.value=String(a.opening);
  var done=false;
  function commit(){
    if(done) return; done=true;
    var n=parseAmount(el.value);
    if(!isNaN(n)&&n!==a.opening){
      var old=a.opening; a.opening=n;
      if(DB.accounts[a.id]) DB.accounts[a.id].opening=n;
      op({t:"account", op:"edit", id:a.id, field:"opening", val:n, old:old});
    }
    renderAll();
  }
  el.addEventListener("blur",commit);
  el.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ev.preventDefault();el.blur();} if(ev.key==="Escape"){done=true;renderTable();} });
  td.textContent=""; td.appendChild(el); el.focus(); el.select();
}

/* ====================================================== CONTEXT MENU ===== */
function openCtx(x,y,id){
  var e=findEntry(id); if(!e) return;
  var c=$("#ctx"), others=S.accounts.filter(function(a){return a.id!==S.activeId;});
  c.innerHTML='<div class="lab">Colour tag</div><div class="swatches">'+
    TAGS.map(function(t){ return '<button class="sw2 '+(e.tag===t.id?"on":"")+'" style="background:'+t.color+'" data-tag="'+t.id+'" title="'+esc(tagLabel(t.id))+'"></button>'; }).join("")+
    '<button class="sw2 '+(!e.tag?"on":"")+'" style="background:var(--panel-2);color:var(--ink-3);border:1px dashed var(--line)" data-tag="" title="No tag">✕</button></div>'+
    (others.length?'<div class="lab">Move to account</div><div class="wrap"><select id="ctx-move"><option value="">Choose account…</option>'+
      others.map(function(a){return '<option value="'+a.id+'">'+esc(a.name)+'</option>';}).join("")+'</select></div>':'')+
    '<div class="sep"></div>'+
    '<button class="ci" data-act="hist">🕘 History of this entry</button>'+
    '<button class="ci" data-act="dup">⧉ Duplicate entry</button>'+
    '<button class="ci" data-act="flip">± Flip sign (in ⇄ out)</button>'+
    '<button class="ci" data-act="top">↑ Send to top</button>'+
    '<div class="sep"></div><button class="ci danger" data-act="del">🗑 Delete entry</button>';
  c.classList.add("show");
  c.style.left=Math.min(x, innerWidth-c.offsetWidth-10)+"px";
  c.style.top =Math.min(y, innerHeight-c.offsetHeight-10)+"px";
  $$(".sw2",c).forEach(function(b){
    b.onclick=function(){
      e.tag=b.dataset.tag;
      if(DB.entries[e.id]) DB.entries[e.id].tag=e.tag;
      op({t:"update", id:e.id, field:"tag", val:e.tag}); closeCtx(); renderAll();
    };
  });
  var mv=$("#ctx-move",c);
  if(mv) mv.onchange=function(){
    var target=S.accounts.filter(function(a){return a.id===mv.value;})[0]; if(!target) return;
    if(DB.entries[e.id]) DB.entries[e.id].accountId=target.id;
    op({t:"move", id:e.id, toAccount:target.id});
    closeCtx(); rebuild(); renderAll(); toast("Moved to "+target.name);
  };
  $$(".ci",c).forEach(function(b){
    b.onclick=function(){
      var act=b.dataset.act; closeCtx();
      if(act==="hist") return openHistory(e.id);
      if(act==="dup"){
        var copy={id:uid(), accountId:acct().id, date:e.date, details:e.details, payBy:e.payBy, amount:e.amount, tag:e.tag};
        DB.entries[copy.id]=Object.assign({},copy,{pos:e.pos-0.5,createdBy:AUTH.user,createdAt:new Date().toISOString(),updatedBy:AUTH.user,updatedAt:new Date().toISOString()});
        op({t:"addEntry", e:copy});
      }
      if(act==="flip"){
        var v=-(Number(e.amount)||0);
        if(DB.entries[e.id]) DB.entries[e.id].amount=v;
        op({t:"update", id:e.id, field:"amount", val:v, old:e.amount});
      }
      if(act==="top"){
        var a=acct(), min=a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0)-1;
        if(DB.entries[e.id]) DB.entries[e.id].pos=min;
        op({t:"reorder", accountId:a.id, order:[e.id].concat(a.entries.filter(function(x){return x.id!==e.id;}).map(function(x){return x.id;}))});
      }
      if(act==="del"){
        delete DB.entries[e.id];
        op({t:"delete", id:e.id});
        toast("Entry deleted — it stays in History and can be restored", function(){ op({t:"restore", id:e.id}); });
      }
      rebuild(); renderAll();
    };
  });
}
function closeCtx(){ $("#ctx").classList.remove("show"); }

/* ---- history ---- */
function openHistory(entryId){
  var title = entryId ? "History of this entry" : "Everything that has changed";
  openModal('<header><div><h3>'+title+'</h3><p id="h-sub">Loading…</p></div>'+
    (entryId?'':'<input id="h-q" placeholder="Filter by person, account or word…" style="height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 10px;outline:none;min-width:260px">')+
    '<button class="tbtn" data-close>✕</button></header>'+
    '<div class="body" id="h-body"><div class="hint">Loading…</div></div>'+
    '<footer><button class="tbtn ghost" id="h-csv">↧ Export log as CSV</button><button class="tbtn primary" data-close>Close</button></footer>');
  var rows=[];
  var call = entryId ? api("history",{entryId:entryId}) : api("audit",{limit:600});
  call.then(function(res){
    if(!res||!res.ok){ $("#h-body").innerHTML='<div class="hint">Could not load the log. '+esc((res&&res.message)||"")+'</div>'; return; }
    rows=res.rows||[]; draw();
  }).catch(function(){
    rows=DB.audit||[]; draw();
    $("#h-sub").textContent="Offline — showing the recent activity cached on this device.";
  });
  if($("#h-q")) $("#h-q").addEventListener("input",draw);
  $("#h-csv").onclick=function(){
    var lines=[["WHEN","WHO","ACTION","ACCOUNT","FIELD","FROM","TO","DETAILS"].join(",")];
    rows.forEach(function(r){ lines.push([fmtWhen(r.ts),r.user,r.action,r.account,r.field,r.oldValue,r.newValue,r.note].map(csvCell).join(",")); });
    download("hisaab-change-log-"+stamp()+".csv", lines.join("\n"), "text/csv");
  };
  function draw(){
    var q=($("#h-q")&&$("#h-q").value||"").toLowerCase();
    var list=rows.filter(function(r){
      return !q || (r.user+" "+r.action+" "+r.account+" "+r.field+" "+r.oldValue+" "+r.newValue+" "+r.note).toLowerCase().indexOf(q)>-1;
    });
    $("#h-sub").textContent = list.length+" change"+(list.length===1?"":"s")+(entryId?" to this entry":"")+" · newest first";
    $("#h-body").innerHTML = list.length ? '<table class="htable"><thead><tr><th>When</th><th>Who</th><th>What changed</th><th></th></tr></thead><tbody>'+
      list.map(function(r){
        var canRestore = r.action==="DELETE" && r.entryId;
        return '<tr><td class="w" title="'+esc(r.ts)+'">'+esc(fmtWhen(r.ts))+'</td>'+
          '<td class="w"><span class="who" style="width:22px;height:22px;font-size:8px;display:inline-grid;background:'+personColor(r.user)+'">'+esc(initials(r.user))+'</span> '+esc(r.user)+'</td>'+
          '<td>'+auditLine(r)+'</td>'+

        s.value=String(guess[i]);
      });
    }
    var map=sels.map(function(s){return +s.value;}), dmy=$("#im-dmy").value==="1";

      var d=map[0]>=0?parseDate(r[map[0]],dmy):"", amt=map[3]>=0?parseAmount(r[map[3]]):NaN;

          '</td><td class="num" style="text-align:right">'+(isNaN(p.amount)?"?":esc(fmt(p.amount)))+'</td></tr>';
      }).join("")+'</tbody></table>';

    $("#im-count").textContent="Net of import: "+fmt(sum);
    $("#im-go").disabled=!good.length;
  }
  function doImport(){
    var accountId=$("#im-acct").value, where=$("#im-where").value;
    var rows=parsed.filter(function(p){return p.ok;}).map(function(p){
      return {id:uid(), date:p.date, details:p.details, payBy:p.payBy, amount:p.amount, tag:""};
    });
    var a=S.accounts.filter(function(x){return x.id===accountId;})[0];
    var base=a?a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0):0;
    rows.forEach(function(r,i){
      DB.entries[r.id]=Object.assign({accountId:accountId, pos: where==="bottom"?(1000+i):(base-rows.length+i),
        createdBy:AUTH.user, createdAt:new Date().toISOString(), updatedBy:AUTH.user, updatedAt:new Date().toISOString()}, r);
    });

    for(var i=0;i<rows.length;i+=120) op({t:"import", accountId:accountId, where:where, rows:rows.slice(i,i+120)});
    S.activeId=accountId; closeModal(); rebuild(); renderAll();

function guessCols(grid,cols){
  var head=grid[0].map(function(c){return String(c||"").toLowerCase();}), g=[-1,-1,-1,-1];
  head.forEach(function(h,i){
    if(/date/.test(h)) g[0]=i;
    else if(/detail|descrip|particular|narration/.test(h)) g[1]=i;
    else if(/pay\s*by|mode|method|type/.test(h)) g[2]=i;
    else if(/total|amount|debit|credit|value/.test(h)) g[3]=i;
  });
  if(g.join()==="-1,-1,-1,-1"){
    var sd=[],sa=[];
    for(var c=0;c<cols;c++){
      var d=0,a=0;
      grid.slice(0,25).forEach(function(r){ if(parseDate(r[c])) d++; if(!isNaN(parseAmount(r[c]))&&/\d/.test(String(r[c]||""))) a++; });
      sd.push(d); sa.push(a);
    }
    g[0]=sd.indexOf(Math.max.apply(null,sd));
    var ac=sa.slice(); ac[g[0]]=-1; g[3]=ac.indexOf(Math.max.apply(null,ac));
    for(var c2=0;c2<cols;c2++){ if(c2!==g[0]&&c2!==g[3]){ if(g[1]<0) g[1]=c2; else if(g[2]<0) g[2]=c2; } }
    if(cols>=4){ if(g[1]<0)g[1]=1; if(g[2]<0)g[2]=2; }
  } else { if(g[0]<0)g[0]=0; if(g[1]<0)g[1]=1; if(g[2]<0&&cols>2)g[2]=2; if(g[3]<0)g[3]=cols-1; }
  return g;
}
function parseGrid(text){
  text=String(text||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").trim();
  if(!text) return [];
  var useTab=text.indexOf("\t")>-1, sep=useTab?"\t":",", rows=[],row=[],cell="",q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch;
  }
  row.push(cell); rows.push(row);
  return rows.filter(function(r){ return r.some(function(c){return String(c).trim()!=="";}); })
    .filter(function(r,i){ if(i>0) return true; var j=r.join(" ").toLowerCase(); return !(/date/.test(j)&&/(detail|amount|total|pay)/.test(j)); });
}

function exportCSV(accts){

var sign=-1;
function addEntry(){
  var a=acct(); if(!a.id) return;
  var raw=$("#f-amt").value.trim(), n=parseAmount(raw);
  if(isNaN(n)){ $("#f-amt").focus(); return toast("Enter an amount"); }
  var det=$("#f-det").value.trim();
  if(!det){ $("#f-det").focus(); return toast("Add a short detail"); }
  var v = /-/.test(raw) ? -Math.abs(n) : sign*Math.abs(n);
  var e={id:uid(), accountId:a.id, date:$("#f-date").value||todayISO(), details:det, payBy:$("#f-pay").value, amount:v, tag:$("#f-tag").value||""};
  var min=a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0)-1;
  DB.entries[e.id]=Object.assign({pos:min, deleted:"", createdBy:AUTH.user, createdAt:new Date().toISOString(), updatedBy:AUTH.user, updatedAt:new Date().toISOString()}, e);
  op({t:"addEntry", e:e});
  $("#f-det").value=""; $("#f-amt").value="";
  rebuild(); renderAll(); $("#f-det").focus(); $("#tablewrap").scrollTop=0;
}
function sideAction(kind,id,act){
  var a=acct(), item=(kind==="recv"?a.recv:a.pay).filter(function(x){return x.id===id;})[0];
  if(!item) return;
  if(act==="settle"){
    var e={id:uid(), accountId:a.id, date:todayISO(),
      details:(kind==="recv"?"RECEIVED FROM ":"PAID TO ")+item.name, payBy:"CASH",
      amount: kind==="recv"?Math.abs(item.amount):-Math.abs(item.amount), tag:""};
    var min=a.entries.reduce(function(m,x){return Math.min(m,x.pos);},0)-1;
    DB.entries[e.id]=Object.assign({pos:min,createdBy:AUTH.user,createdAt:new Date().toISOString(),updatedBy:AUTH.user,updatedAt:new Date().toISOString()},e);
    op({t:"addEntry", e:e});
  }
  delete DB.side[id];
  op({t:"side", op:act, id:id});
  rebuild(); renderAll();
  toast(act==="settle"?"Posted to the ledger":"Removed");
}
function addSide(kind){
  var a=acct();
  var name=$("#"+kind+"-n").value.trim(), amt=parseAmount($("#"+kind+"-a").value);
  if(!name||isNaN(amt)) return toast("Name and amount, please");
  var s={id:uid(), accountId:a.id, kind:kind, name:name, amount:Math.abs(amt)};
  DB.side[s.id]=Object.assign({deleted:""},s);
  op({t:"side", op:"add", s:s});
  $("#"+kind+"-n").value=""; $("#"+kind+"-a").value="";
  rebuild(); renderSide(); renderStats();
}

    if(e.key==="Escape"){ closeCtx(); if($("#scrim").classList.contains("show")) closeModal(); return; }
    if(typing) return;
    if(e.key==="/"){ e.preventDefault(); $("#q").focus(); }
    if(e.key.toLowerCase()==="n"){ e.preventDefault(); $("#f-det").focus(); }
  });
  document.addEventListener("mousemove",function(){ lastActivity=Date.now(); });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden){ lastActivity=Date.now(); net.lastPull=0; pollTick(); } });
  window.addEventListener("online",function(){ net.lastPull=0; flush(); pollTick(); });
  window.addEventListener("beforeunload",function(e){ if(Q.length){ e.preventDefault(); e.returnValue=""; } });
  setInterval(pollTick,1500);
  setInterval(function(){ if(Q.length && !net.sending) flush(); },5000);
  setInterval(renderFeed, 60000);
}

/* =============================================================== BOOT ==== */
function showApp(){
  $("#gate").classList.remove("show");
  $("#app").classList.add("show");
  $("#f-date").value=todayISO();
  renderAll(); setNet(Q.length?"saving":"live");
}
function doLogin(){
  var pw=$("#gate-pw").value;
  if(!pw) return;
  var btn=$("#gate-go"); btn.disabled=true; btn.textContent="Checking…"; $("#gate-err").textContent="";
  api("login",{password:pw}).then(function(res){
    btn.disabled=false; btn.textContent="Sign in";
    if(res && res.ok){
      AUTH.token=res.token; AUTH.user=res.user; AUTH.people=res.people||[];
      lsSet("token",res.token); lsSet("user",res.user); lsSet("people",AUTH.people);
      $("#gate-pw").value="";
      DB.accounts={}; DB.entries={}; DB.side={};
      ingest(res); showApp(); flush();
      toast("Welcome, "+res.user);
    } else {
      $("#gate-err").textContent=(res&&res.message)||"That password did not work.";
      $("#gate-pw").select();
    }
  }).catch(function(err){
    btn.disabled=false; btn.textContent="Sign in";
    $("#gate-err").textContent="Could not reach the server. Check your connection.";
  });
}
(function boot(){
  var cached=lsGet("db",null), cui=lsGet("ui",{});
  S.theme=cui.theme||"light"; S.activeId=cui.activeId||null; S.tagLabels=cui.tagLabels||{};
  document.documentElement.setAttribute("data-theme",S.theme);
  if(cached){ DB.rev=cached.rev||0; DB.since=cached.since||""; DB.accounts=cached.accounts||{}; DB.entries=cached.entries||{}; DB.side=cached.side||{}; DB.audit=cached.audit||[]; }
  Q=lsGet("q",[])||[];
  AUTH.token=lsGet("token","")||""; AUTH.user=lsGet("user","")||""; AUTH.people=lsGet("people",[])||[];
  bind();

  if(!API_URL){
    $("#gate-sub").innerHTML="This copy is not connected to your Google Sheet yet.";
    $("#gate-pw").style.display="none"; $("#gate-go").textContent="Open in offline demo mode";
    $("#gate-foot").innerHTML="Open <b>index.html</b>, put your Apps Script Web App URL in <b>API_URL</b> near the top of the file, then reload. See README.md for the 4 steps.";
    $("#gate-go").onclick=function(){
      DEMO=true; AUTH.user="DEMO"; AUTH.people=["DEMO"];
      if(!Object.keys(DB.accounts).length){
        ["SIAM FULL DETAIL","AUS/JPN","UK/USA","BKK/DXB"].forEach(function(n,i){
          var id="demo"+i; DB.accounts[id]={id:id,name:n,currency:"AED",opening:0,pos:i,deleted:""};
        });
      }
      rebuild(); showApp(); setNet("live");
    };
    return;
  }

  $("#gate-go").onclick=doLogin;
  $("#gate-pw").addEventListener("keydown",function(e){ if(e.key==="Enter") doLogin(); });

  if(AUTH.token){
    rebuild();
    if(Object.keys(DB.accounts).length) showApp();     // paint the cached copy at once
    api("pull",{rev:0, full:true}).then(function(res){
      if(res && res.ok){ ingest(res); showApp(); flush(); }
      else if(res && res.error==="AUTH"){ signedOut(); }
      else setNet("off",(res&&res.message)||"");
    }).catch(function(err){
      if(Object.keys(DB.accounts).length){ setNet("off",err.message); }
      else { $("#gate-err").textContent="Could not reach the server. Check your connection."; }
    });
  }
  setTimeout(function(){ var p=$("#gate-pw"); if(p && $("#gate").classList.contains("show")) p.focus(); },120);
})();
</script>
